[package]
name = "tigerparty_client"
version = "1.0.0"
edition = "2021"
description = "TigerProjectParty Rust client — async reqwest client delegating to the standalone ProjectParty backend (project_party/go/cmd/main.go, :8106)"

[lib]
name = "tigerparty_client"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
