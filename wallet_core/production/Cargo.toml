[package]
name = "tiger_wallet_production"
version = "1.0.0"
edition = "2021"
description = "TigerWallet Production-Ready Wallet Core"
authors = ["TigerWallet Team"]

[dependencies]
# Cryptography - production-grade
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8", "u64_backend"] }
secp256k1 = { version = "0.28", features = ["global-domains", "bitcoin_hashes", "arithmetic"] }
k256 = { version = "0.13", features = ["ecdsa", "arithmetic", "std"] }
bip32 = "0.5"
bip39 = { version = "0.11", features = ["all"] }
base58 = "0.21"
hex = "0.4"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
ripemd160 = "0.10"

# Async
tokio = { version = "1.35", features = ["full"] }

# Serialization  
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
tracing = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde", "crypto"] }

# Network
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Ethereum
ethereum-types = "0.14"
ethereum = "0.14"
rlp = "0.5"

[dev-dependencies]
criterion = "0.5"

[lib]
name = "tiger_wallet"
path = "src/lib.rs"

[[bench]]
name = "wallet_benches"
harness = false
