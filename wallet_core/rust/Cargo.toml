[package]
name = "tiger_wallet_core"
version = "1.0.0"
edition = "2021"
description = "TigerWallet Core - Production-ready wallet operations in Rust"
authors = ["TigerWallet Team"]
license = "MIT"

[lib]
name = "tiger_wallet_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Cryptography - using well-audited crates
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8"] }
secp256k1 = { version = "0.28", features = ["global-domains", "bitcoin_hashes"] }
k256 = "0.13"
bip32 = "0.5"
bip39 = "0.11"
base58 = "0.21"
hex = "0.4"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
ripemd160 = "0.10"

# Async
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Network
reqwest = { version = "0.11", features = ["json"] }

# Ethereum types
ethereum-types = "0.14"
ethereum = "0.14"

# RLP encoding
rlp = "0.5"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8"

[[bench]]
name = "wallet_benches"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
