[package]
name = "wl_policy_engine"
version = "1.0.0"
edition = "2021"
description = "TigerWallet WL policy engine: real Ed25519 license verification + transaction classification + rule enforcement (security/safety layer for the WL auto-approve gate)"

[lib]
name = "wl_policy_engine"
path = "src/lib.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
rand = "0.8"
