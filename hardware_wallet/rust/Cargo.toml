[package]
name = "tiger_hardware_wallet"
version = "1.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
parking_lot = "0.12"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
bitcoin_hashes = "0.12"
k256 = "0.13"
bs58 = "0.5"

[profile.release]
opt-level = 3
lto = true