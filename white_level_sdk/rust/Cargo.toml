[package]
name = "white-level-sdk"
version = "1.0.0"
edition = "2021"
description = "White Level SDK for external hosting connection to TigerWallet Super Admin"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
ring = "0.17"
base64 = "0.21"
rand = "0.8"
url = "2"
futures = "0.3"
parking_lot = "0.12"
once_cell = "1"
hostname = "0.3"

[features]
default = ["client"]
client = []
server = []

[lib]
name = "white_level_sdk"
path = "src/lib.rs"

[[bin]]
name = "wl-client"
path = "src/client_main.rs"

[[bin]]
name = "wl-server"
path = "src/server_main.rs"
