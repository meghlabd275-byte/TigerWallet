[package]
name = "tigerwallet-white-label-high-speed"
version = "1.0.0"
edition = "2021"
description = "High-speed components for TigerWallet White Label System"
authors = ["TigerWallet Team"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native", "postgres", "uuid", "chrono"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ring = "0.17"
base64 = "0.21"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
jwt = "0.16"
bcrypt = "0.15"
argon2 = "0.5"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "5.5"

[lib]
name = "white_label_high_speed"
path = "src/lib.rs"

[[bin]]
name = "wl-service"
path = "src/main.rs"
