[package]
name = "white-level-sdk"
version = "2.0.0"
edition = "2021"
description = "Fail-closed license/heartbeat client + Ed25519 verifier for TigerWallet white-label products"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
hex = "0.4"
thiserror = "1"
parking_lot = "0.12"
tracing = "0.1"
rand = "0.8"

[lib]
name = "white_level_sdk"
path = "src/lib.rs"
