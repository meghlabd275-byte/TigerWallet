[package]
name = "gasless_tx"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
thiserror = "1.0"
ring = "0.17"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
hex = "0.4"
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4.38"
sha3 = "0.12.0"
