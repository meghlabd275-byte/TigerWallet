<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f7f7fa;
      --text: #1a1a1a;
      --muted: #667085;
      --accent: #f37620;
      --ok: #16a34a;
      --err: #c0392b;
      --border: #e4e4e7;
    }
    [data-theme="dark"] {
      --bg: #14151a;
      --panel: #1e1f26;
      --text: #f5f5f7;
      --muted: #9aa0ab;
      --border: #2e3038;
    }
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    h1 { margin: 0 0 4px; font-size: 16px; }
    .sub { color: var(--muted); margin: 0 0 12px; font-size: 11px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .row { display: flex; justify-content: space-between; align-items: center; }
    .label { color: var(--muted); font-size: 11px; }
    .value { font-weight: 600; }
    .status-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); margin-right: 6px;
    }
    .status-dot.ok { background: var(--ok); }
    .status-dot.err { background: var(--err); }
    button, a.btn {
      display: block; width: 100%; box-sizing: border-box;
      padding: 9px 10px; margin-bottom: 7px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--panel); color: var(--text);
      cursor: pointer; text-align: center; text-decoration: none;
      font-size: 12px; font-family: inherit;
    }
    button:hover, a.btn:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    input {
      width: 100%; box-sizing: border-box; padding: 7px 8px;
      border: 1px solid var(--border); border-radius: 7px;
      background: var(--bg); color: var(--text); font-size: 12px; font-family: inherit;
    }
    .hint { color: var(--muted); font-size: 10px; margin: 4px 0 0; }
  </style>
</head>
<body>
  <h1>TigerBots</h1>
  <p class="sub">Trading bot control panel</p>

  <div class="card">
    <div class="row">
      <span class="label">Backend</span>
      <span class="value" id="backendStatus"><span class="status-dot"></span>checking…</span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Running bots</span>
      <span class="value" id="runningBots">—</span>
    </div>
    <div class="row">
      <span class="label">Total bots</span>
      <span class="value" id="totalBots">—</span>
    </div>
  </div>

  <button class="primary" id="openDashboard">Open Bot Dashboard</button>
  <a class="btn" id="openBots" target="_blank" rel="noopener">My Bots</a>
  <a class="btn" id="openSubscriptions" target="_blank" rel="noopener">Subscriptions</a>
  <a class="btn" id="openFees" target="_blank" rel="noopener">Fee Addresses</a>

  <div class="card">
    <div class="label">Bot platform URL</div>
    <input type="text" id="webUrl" placeholder="http://localhost:8463" />
    <div class="hint">Where your TigerBots web console is served.</div>
    <button id="saveUrl" style="margin-top:8px;">Save</button>
  </div>

  <button id="toggleTheme">Toggle theme</button>

  <script src="popup.js"></script>
</body>
</html>
