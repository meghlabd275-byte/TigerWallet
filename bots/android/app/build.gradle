plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// Release signing material comes from the operator (gradle properties or the
// environment) and is never committed.
def releaseStoreFile = project.findProperty("TIGERWALLET_KEYSTORE") ?: System.getenv("TIGERWALLET_KEYSTORE")
def releaseStorePassword = project.findProperty("TIGERWALLET_KEYSTORE_PASSWORD") ?: System.getenv("TIGERWALLET_KEYSTORE_PASSWORD")
def releaseKeyAlias = project.findProperty("TIGERWALLET_KEY_ALIAS") ?: System.getenv("TIGERWALLET_KEY_ALIAS")
def releaseKeyPassword = project.findProperty("TIGERWALLET_KEY_PASSWORD") ?: System.getenv("TIGERWALLET_KEY_PASSWORD")

android {
    namespace "com.tigerbots"
    compileSdk 34

    defaultConfig {
        applicationId "com.tigerbots"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Backend base URL is baked in as a default but remains overridable at
        // runtime from the Settings screen (persisted in encrypted prefs), so a
        // physical device can reach a non-local deployment without a rebuild.
        buildConfigField "String", "DEFAULT_API_BASE_URL", "\"${project.findProperty('botsApiBaseUrl') ?: 'http://10.0.2.2:8471'}\""
    }

    signingConfigs {
        release {
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.activity:activity-ktx:1.9.2"
    implementation "androidx.fragment:fragment-ktx:1.8.3"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}

// Fail a release build that has no keystore instead of emitting an unsigned
// artefact that no store accepts.
gradle.taskGraph.whenReady { graph ->
    def wantsReleaseArtifact = graph.allTasks.any { t ->
        def n = t.name.toLowerCase()
        (n.startsWith("assemble") || n.startsWith("bundle") || n.startsWith("package")) && n.contains("release")
    }
    if (wantsReleaseArtifact && !releaseStoreFile) {
        throw new GradleException(
            "Release build requires a signing keystore. Set TIGERWALLET_KEYSTORE, " +
            "TIGERWALLET_KEYSTORE_PASSWORD, TIGERWALLET_KEY_ALIAS and " +
            "TIGERWALLET_KEY_PASSWORD (gradle properties or environment).")
    }
}
