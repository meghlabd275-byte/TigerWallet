[package]
name = "wallet_service"
version = "1.0.0"
edition = "2021"
description = "TigerSwap Wallet Service - Production-Ready Rust Wallet API"

[dependencies]
# Crypto
secp256k1 = { version = "0.28", features = ["recovery", "rand-std"] }
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
ripemd = "0.1"
bs58 = "0.5"
hex = "0.4"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.7", features = ["derive"] }

# Async
tokio = { version = "1.32", features = ["full"] }
futures = "0.3"

# Networking
hyper = "1.1"
http-body = "1.0"
tower = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Metrics
metrics = "0.21"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "wallet-service"
path = "src/main.rs"

[lib]
name = "wallet_service"
path = "src/lib.rs"