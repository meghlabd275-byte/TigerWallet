[package]
name = "zk_infrastructure"
version = "1.0.0"
edition = "2021"
description = "TigerSwap ZK Infrastructure - Production-Ready Zero-Knowledge Proofs"

[dependencies]
# Cryptography: curve25519-dalek provides the Ristretto/Ed25519 group used for the
# real Fiat-Shamir Schnorr proofs of knowledge generated by ZKProver.
curve25519-dalek = { version = "4.0", features = ["rand_core", "digest"] }
sha2 = "0.10"
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Identifiers
uuid = { version = "1.0", features = ["v4"] }

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async
tokio = { version = "1.32", features = ["full"] }

[dev-dependencies]
quickcheck = "1.0"

[[bin]]
name = "zk-prover"
path = "src/main.rs"

[lib]
name = "zk_infrastructure"
path = "src/lib.rs"