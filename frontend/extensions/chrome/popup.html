<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TigerWallet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 360px; min-height: 500px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: white; }
    .header { padding: 16px; background: linear-gradient(135deg, #f97316, #ea580c); display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: bold; }
    .balance { padding: 16px; background: #1e293b; }
    .balance-label { color: #94a3b8; font-size: 12px; }
    .balance-value { font-size: 28px; font-weight: bold; margin: 4px 0; }
    .balance-usd { color: #94a3b8; }
    .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 16px; background: #1e293b; }
    .action { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px; background: #334155; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    .action:hover { background: #475569; }
    .action-icon { font-size: 24px; }
    .action-label { font-size: 10px; color: #94a3b8; }
    .chains { padding: 16px; }
    .chains-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #94a3b8; }
    .chain-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .chain { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #334155; border-radius: 20px; font-size: 12px; cursor: pointer; }
    .chain.active { background: #f97316; }
    .btn { width: calc(100% - 32px); margin: 0 16px 16px; padding: 14px; background: #f97316; border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #ea580c; }
    .connected { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #064e3b; border-radius: 8px; margin: 16px; }
    .dot { width: 8px; height: 8px; background: #34d399; border-radius: 50%; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🐯 TigerWallet</div>
    <div style="font-size: 12px;">v1.0.0</div>
  </div>
  
  <div class="connected">
    <div class="dot"></div>
    <span>Connected to Ethereum</span>
  </div>
  
  <div class="balance">
    <div class="balance-label">Total Balance</div>
    <div class="balance-value">$12,450.00</div>
    <div class="balance-usd">4.2 ETH</div>
  </div>
  
  <div class="actions">
    <div class="action"><span class="action-icon">📤</span><span class="action-label">Send</span></div>
    <div class="action"><span class="action-icon">📥</span><span class="action-label">Receive</span></div>
    <div class="action"><span class="action-icon">🔄</span><span class="action-label">Swap</span></div>
    <div class="action"><span class="action-icon">📊</span><span class="action-label">Portfolio</span></div>
  </div>
  
  <div class="chains">
    <div class="chains-title">Quick Switch</div>
    <div class="chain-list">
      <div class="chain active">⬡ ETH</div>
      <div class="chain">🟡 BSC</div>
      <div class="chain">🟣 Polygon</div>
      <div class="chain">🔵 Arbitrum</div>
      <div class="chain">☀️ Solana</div>
      <div class="chain">🔶 Tron</div>
    </div>
  </div>
  
  <button class="btn">Open Dashboard</button>
  
  <!-- Send Modal with QR Scanner -->
  <div id="send-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 100;">
    <div style="background: #1e293b; margin: 20px; border-radius: 12px; padding: 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="margin: 0;">Send</h3>
        <button id="close-send" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer;">×</button>
      </div>
      <div style="margin-bottom: 16px;">
        <label style="display: block; margin-bottom: 8px; color: #94a3b8; font-size: 12px;">Recipient Address</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="send-to" placeholder="0x..." style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white;">
          <button id="scan-qr" style="padding: 12px; background: #334155; border: none; border-radius: 8px; cursor: pointer;">📷</button>
        </div>
      </div>
      <div style="margin-bottom: 16px;">
        <label style="display: block; margin-bottom: 8px; color: #94a3b8; font-size: 12px;">Amount</label>
        <input type="number" id="send-amount" placeholder="0.0" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white;">
      </div>
      <button id="send-btn" style="width: 100%; padding: 14px; background: #f97316; border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer;">Send</button>
    </div>
  </div>

  <!-- QR Scanner Modal -->
  <div id="qr-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 101;">
    <div style="background: #1e293b; margin: 20px; border-radius: 12px; padding: 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="margin: 0;">Scan QR Code</h3>
        <button id="close-qr" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer;">×</button>
      </div>
      <div style="background: #000; border-radius: 12px; min-height: 200px; display: flex; align-items: center; justify-content: center;">
        <div style="text-align: center; color: #fff; padding: 30px;">
          <span style="font-size: 48px;">📷</span>
          <p>Camera QR Scanner</p>
          <p style="font-size: 12px; color: #888;">Point camera at QR code</p>
        </div>
      </div>
      <div style="margin-top: 20px;">
        <label style="display: block; margin-bottom: 8px; color: #94a3b8; font-size: 12px;">Or enter manually:</label>
        <input type="text" id="manual-address" placeholder="0x..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white;">
        <button id="use-address" style="width: 100%; margin-top: 10px; padding: 12px; background: #f97316; border: none; border-radius: 8px; color: white; cursor: pointer;">Use Address</button>
      </div>
      <div style="margin-top: 20px;">
        <label style="display: block; margin-bottom: 8px; color: #94a3b8; font-size: 12px;">Recent:</label>
        <div class="recent-address" data-addr="0x742d35Cc6634C0532925a3b844Bc9e7595f1234" style="padding: 10px; background: #334155; border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-family: monospace; font-size: 12px;">0x742d...f1234</div>
        <div class="recent-address" data-addr="0x1234567890abcdef1234567890abcdef12345678" style="padding: 10px; background: #334155; border-radius: 8px; cursor: pointer; font-family: monospace; font-size: 12px;">0x1234...5678</div>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
