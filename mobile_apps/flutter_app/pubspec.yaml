name: tiger_wallet
description: TigerWallet - Decentralized Multi-Chain Wallet
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  intl: ^0.18.1
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  camera: ^0.10.5+9
  image_picker: ^1.0.4
  webview_flutter: ^4.2.2
  flutter_web3: ^2.1.1
  bip39: ^1.0.6
  ed25519_hd_key: ^1.1.0
  pointycastle: ^3.7.3
  crypto: ^3.0.3
  eth_sig_util: ^0.0.1
  hex: ^0.2.0
  base58check: ^1.0.2
  bs58: ^1.0.2
  url_launcher: ^6.2.2
  uni_links: ^0.5.1
  local_auth: ^2.1.8
  local_notifications: ^0.1.0
  connectivity_plus: ^5.0.1
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  lottie: ^3.0.0
  # R2: Google Drive encrypted-seed backup. googleapis provides the Drive v3
  # REST client; google_sign_in + extension_google_sign_in_as_google_auth_user
  # yield an authenticated HTTP client scoped to drive.file (app-specific, no
  # blanket Drive access). When no OAuth web client id is configured the
  # GoogleDriveBackupService backs up fail-closed with an honest error rather
  # than fake success.
  googleapis: ^11.0.0
  google_sign_in: ^6.2.1
  extension_google_sign_in_as_google_auth_user: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700