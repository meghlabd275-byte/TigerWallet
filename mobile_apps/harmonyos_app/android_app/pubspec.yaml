name: tiger_wallet
description: TigerWallet - Enterprise-grade multichain Web3 wallet
version: 1.0.0+1
publish_to: 'https://github.com/meghlabd275-byte/TigerWallet'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Wallet Core
  flutter_rust_bridge: ^2.0.0
  rust_lib: ^1.0.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^5.0.0
  flutter_svg: ^2.0.9
  
  # State Management
  flutter_bloc: ^8.1.3
  riverpod: ^2.4.9
  get_it: ^7.6.4
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Networking
  dio: ^5.3.3
  web_socket_channel: ^2.4.0
  connectivity_plus: ^5.0.2
  
  # Blockchain
  web3dart: ^2.0.0
  walletconnect_dart: ^1.0.0
  solana_dart: ^1.0.0
  
  # Crypto
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  bip39: ^1.0.6
  ed25519_hd_key: ^2.0.0
  
  # Utils
  intl: ^0.18.1
  uuid: ^4.2.1
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  qr_code: ^2.0.0
  qr_flutter: ^4.1.0
  
  # Image
  cached_network_image: ^3.3.1
  image_picker: ^1.0.5
  shimmer: ^3.0.0
  
  # Local Auth
  local_auth: ^2.1.8
  bioauth: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  ffigen: ^10.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
    - assets/logos/
    - assets/flags/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  generate: true