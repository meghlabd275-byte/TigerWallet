[package]
name = "tigerwallet-advanced-orders"
version = "0.1.0"
edition = "2021"

[dependencies]
rust_decimal = { version = "1.36", features = ["serde"] }
rust_decimal_macros = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
