[package]
name = "selfhosted_masterwallet"
version = "1.0.0"
edition = "2021"
description = "TigerWallet Self-Hosted Master Wallet"

[dependencies]
actix-web = "4.4"
tokio = { version = "1.33", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }

[features]
default = ["postgres"]

[profile.release]
opt-level = 3
lto = true
