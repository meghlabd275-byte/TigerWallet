[package]
name = "selfhosted_masterwallet"
version = "1.0.0"
edition = "2021"
description = "TigerWallet Self-Hosted Master Wallet"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.21"
rand = "0.8"
# Real crypto primitives (pinned exact versions).
bip39 = { version = "=2.1.0", features = ["rand"] }
k256 = { version = "=0.13.4", features = ["ecdsa"] }
sha3 = "=0.10.8"
scrypt = "=0.11.0"
aes-gcm = "=0.10.3"
ed25519-dalek = "=2.1.1"
ripemd = "=0.1.3"
reqwest = { version = "=0.12.12", default-features = false, features = ["json", "rustls-tls"] }

[features]
default = []

[profile.release]
opt-level = 3
lto = true
