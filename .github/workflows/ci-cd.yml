name: TigerWallet CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============== Code Quality ==============
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Go linter
        run: |
          go install golang.org/x/lint/golint@latest
          golint -set_exit_status ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go fmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted correctly"
            gofmt -d .
            exit 1
          fi

      - name: Run Go tests with coverage
        run: |
          go test -v -race -coverprofile=coverage.out ./...
        env:
          BILLING_DB_HOST: localhost
          BILLING_REDIS_HOST: localhost

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.out
          flags: unittests

  # ============== Build Go Services ==============
  build-go:
    name: Build Go Services
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        service:
          - billing_subscription/go
          - multi_tenancy/go
          - notifications/go
          - super_admin/go
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build service
        working-directory: ${{ matrix.service }}
        run: |
          go mod download
          go build -o service ./...

      - name: Run service tests
        working-directory: ${{ matrix.service }}
        run: go test -v ./...

  # ============== Build Rust Fetcher ==============
  build-rust:
    name: Build Rust Fetcher
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable

      - name: Build fetcher
        working-directory: fetcher_core/rust
        run: |
          cargo build --release
          cargo test --release

  # ============== Build Frontend ==============
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        app:
          - admin/web
          - white_label/frontend
          - super_admin/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Run linter
        working-directory: ${{ matrix.app }}
        run: npm run lint

      - name: Run tests
        working-directory: ${{ matrix.app }}
        run: npm test -- --coverage

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  # ============== Security Scanning ==============
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-go
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Go security checker
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity medium ./...

      - name: Run dependency checker
        run: |
          go install github.com/sonatype-nexus-community/nancy@latest
          go list -json -m all | nancy sleuth

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate || true

  # ============== Build Docker Images ==============
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-go, build-rust, build-frontend]
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        service:
          - context: .
            dockerfile: infrastructure/docker/billing/Dockerfile
            image: billing-service
          - context: .
            dockerfile: infrastructure/docker/multi-tenancy/Dockerfile
            image: multi-tenancy-service
          - context: .
            dockerfile: infrastructure/docker/fetcher/Dockerfile
            image: fetcher-service
          - context: .
            dockerfile: infrastructure/docker/notifications/Dockerfile
            image: notification-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============== Deploy to Staging ==============
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add actual deployment commands here

  # ============== Deploy to Production ==============
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add actual deployment commands here

  # ============== Notify ==============
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Notify on failure
        if: needs.*.result == 'failure'
        run: |
          echo "Pipeline failed - notify team"
          # Add Slack/Discord notification here
