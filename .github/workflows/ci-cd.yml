name: TigerWallet CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============== Code Quality ==============
  # This repository is a monorepo of independent Go modules; there is no root
  # go.mod, so the checks run per module. Adding a root module would couple
  # separately-deployable services, which is why it is done this way.
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify every Go module builds and vets
        run: |
          set -uo pipefail
          failed=0
          while read -r mod; do
            [ -z "$mod" ] && continue
            [ -f "$mod/go.mod" ] || continue
            # A module directory with no root .go files is a container for
            # submodules; ./... there matches no packages.
            if ! ls "$mod"/*.go >/dev/null 2>&1 && [ ! -d "$mod/cmd" ]; then
              continue
            fi
            echo "::group::$mod"
            # -o /dev/null avoids the "build output X already exists and is a
            # directory" failure for modules whose binary name collides with a
            # source directory (e.g. security/kyc_aml/go/cmd).
            #
            # tiger_smart_chain links go-ethereum v1.13.15, which references
            # runtime.stopTheWorld; Go 1.23+ rejects that reference unless
            # -checklinkname=0 is passed (tiger_smart_chain/Makefile documents
            # the same flag). That flag does not exist before Go 1.23, and the
            # toolchain version is per-module (a module declaring `go 1.23`
            # makes Go fetch a 1.23 toolchain), so the flag is used as a
            # fallback rather than unconditionally.
            if ! (cd "$mod" && go build -o /dev/null ./...); then
              if ! (cd "$mod" && go build -ldflags='-checklinkname=0' -o /dev/null ./...); then
                echo "::error title=go build failed::$mod"
                failed=1
              fi
            fi
            # api_gateway, billing_subscription and bots keep their sources in
            # nested modules (go/ subdirectories with their own go.mod), so
            # `./...` matches nothing here and vet exits 1 with "no packages to
            # vet". Those nested modules are checked by their own pass over the
            # module list; an empty result is therefore not a failure.
            if ! (cd "$mod" && go vet ./...); then
              if [ -n "$(cd "$mod" && go list ./... 2>/dev/null)" ]; then
                echo "::error title=go vet failed::$mod"
                failed=1
              fi
            fi
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path '*/vendor/*' -not -path '*/node_modules/*' | sed 's|/go.mod||' | sed 's|^\./||' | sort)
          exit $failed

      - name: Check Go formatting
        run: |
          set -uo pipefail
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path '*/vendor/*' -not -path '*/node_modules/*') 2>/dev/null || true)
          if [ -n "$unformatted" ]; then
            echo "::error title=Unformatted Go files::Run gofmt -w on these files"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go unit tests
        run: |
          set -uo pipefail
          failed=0
          # Suites that need PostgreSQL and Redis run in the integration job.
          for mod in go/chainsdk go/wallet_api master_wallet/backend admin/go super_admin/go \
                     white_label_admin/go project_party mm_bot_platform/bot_api \
                     wl_user_wallet/go wl_master_wallet/go wl_bots/go wl_card/go \
                     wl_liquidity/go wl_project_party/go license_service/go \
                     permission_bridge/go kill_switch listing_service/go go/payment \
                     go/full_fetchers \
                     billing_subscription/go notifications/go multi_tenancy/go; do
            [ -d "$mod" ] || continue
            echo "::group::$mod"
            if ! (cd "$mod" && go test ./...); then
              echo "::error title=go test failed::$mod"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  # ============== Integration tests (PostgreSQL + Redis) ==============
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tiger
          POSTGRES_PASSWORD: tiger
          POSTGRES_DB: tigerwallet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test the wallet API against real PostgreSQL and Redis
        working-directory: go/wallet_api
        env:
          DATABASE_URL: postgres://tiger:tiger@localhost:5432/tigerwallet?sslmode=disable
          REDIS_ADDR: localhost:6379
          JWT_SECRET: ci-jwt-secret-not-for-production-use
        run: go test -race ./...

      - name: Test the master wallet backend against real PostgreSQL and Redis
        working-directory: master_wallet/backend
        env:
          DATABASE_URL: postgres://tiger:tiger@localhost:5432/tigerwallet?sslmode=disable
          REDIS_ADDR: localhost:6379
          JWT_SECRET: ci-jwt-secret-not-for-production-use
        run: go test ./...

      - name: Test super admin against real PostgreSQL
        working-directory: super_admin/go
        env:
          TEST_DATABASE_URL: postgres://tiger:tiger@localhost:5432/tigerwallet?sslmode=disable
        run: go test ./...

      - name: Test the multi-tenancy service against real PostgreSQL
        working-directory: multi_tenancy/go
        env:
          TEST_DATABASE_URL: postgres://tiger:tiger@localhost:5432/tigerwallet?sslmode=disable
        run: go test ./...

      # The admin API runs AutoMigrate during startup, so a broken migration
      # means it cannot boot at all. This ran only as a unit test with no
      # database, where the migration tests skip, which is how a
      # startup-blocking migration regression reached main. The suite resets
      # the schema, so it gets its own database rather than sharing one.
      - name: Create the admin migration test database
        env:
          PGPASSWORD: tiger
        run: createdb -h localhost -U tiger tigerwallet_admin_ci

      - name: Test the admin API startup migration against real PostgreSQL
        working-directory: admin/go
        env:
          TEST_DATABASE_URL: postgres://tiger:tiger@localhost:5432/tigerwallet_admin_ci?sslmode=disable
          JWT_SECRET: ci-jwt-secret-not-for-production-use
          ADMIN_JWT_SECRET: ci-admin-jwt-secret-not-for-production-use
          DEFAULT_ADMIN_PASSWORD: ci-admin-password-not-for-production-use
        run: go test ./pkg/database/ -v

  # ============== Build Rust Components ==============
  build-rust:
    name: Build Rust (${{ matrix.crate }})
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        crate:
          - rust/security
          - rust/masterwallet_fetchers
          - rust/userwallet_fetchers
          - rust/admin_fetchers
          - fetcher_core/rust
          # The in-house KYC engine decides whether an applicant is verified,
          # and both the P2P and card gates trust that decision. Its tests must
          # run on every change, so it is built and tested here rather than
          # only in the image build.
          - security/rust/kyc_engine
          - security/rust/kyc_service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.crate }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.crate)) }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.crate }}-

      - name: Build
        working-directory: ${{ matrix.crate }}
        run: cargo build --release

      - name: Test
        working-directory: ${{ matrix.crate }}
        run: cargo test --release

      # Catches deny-by-default lints (e.g. clippy::never_loop), which a plain
      # `cargo build`/`cargo test` never reports. Pre-existing style warnings are
      # left as warnings on purpose so the gate fails only on real defects.
      - name: Clippy
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --all-targets

  # ============== Build C++ Components ==============
  # libsecp256k1-dev is required by cpp/core for real secp256k1 arithmetic.
  build-cpp:
    name: Build C++ (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        component:
          - cpp/core
          - cpp/trading_engine_ultra
          - hardware_wallet/cpp
          - mev_protection/cpp
          - master_wallet/desktop
          - admin/cpp
          - super_admin/cpp
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev libcurl4-openssl-dev libsecp256k1-dev pkg-config

      - name: Configure
        run: cmake -S ${{ matrix.component }} -B ${{ matrix.component }}/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build ${{ matrix.component }}/build --parallel

      - name: Test
        working-directory: ${{ matrix.component }}/build
        run: ctest --output-on-failure

  # ============== Build Frontend ==============
  build-frontend:
    name: Build Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        app:
          - admin/web
          - super_admin/web
          - white_label/frontend
          - master_wallet/web
          - user_wallet/web
          - bots/web
          - project_party/web
          - frontend/web_nextjs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.app }}
        run: npm run lint --if-present

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  # ============== Security Scanning ==============
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Reject committed secrets
        run: |
          if grep -rInE "(PRIVATE_KEY|MNEMONIC|SEED_PHRASE|JWT_SECRET|ENCRYPTION_KEY)=[^[:space:]]+" \
               --include='*.go' --include='*.ts' --include='*.tsx' --include='*.js' \
               --include='*.kt' --include='*.swift' --include='*.dart' --include='*.rs' \
               --exclude-dir=node_modules --exclude-dir=vendor .; then
            echo "::error title=Committed secret::A literal credential assignment was found"
            exit 1
          fi

      - name: Run gosec on the wallet API
        working-directory: go/wallet_api
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" -severity medium -exclude-dir=node_modules ./... || true

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Run npm audit
        run: |
          for app in admin/web super_admin/web white_label/frontend frontend/web_nextjs; do
            (cd "$app" && npm audit --audit-level=high || true)
          done

  # ============== Build Docker Images ==============
  # Discover every buildable service from the compose files so the matrix
  # cannot drift away from what actually ships. The previous hand-written
  # matrix covered 5 images while the stack runs ~70 services, so most of the
  # platform was never built before a release.
  docker-matrix:
    name: Discover Docker Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build matrix from compose files
        id: matrix
        run: |
          set -euo pipefail
          python3 scripts/ci/list-docker-services.py --output matrix.json
          count=$(python3 -c "import json;print(len(json.load(open('matrix.json'))['include']))")
          echo "Discovered $count buildable services"
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  docker:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [code-quality, build-rust, build-frontend, build-cpp, docker-matrix]
    if: github.event_name != 'pull_request'
    # Without an explicit packages: write the job inherits the repository
    # default token scope and every push to ghcr.io is rejected with
    # "installation not allowed to Create organization package".
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.docker-matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build (without pushing) on pull requests so a broken Dockerfile is caught
  # before merge rather than at release time.
  docker-verify:
    name: Verify Docker Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [docker-matrix]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.docker-matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build only
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/${{ matrix.service.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============== Deploy ==============
  # Real health-gated rolling deploy with automatic rollback. The previous
  # `echo "Deploying..."` placeholders meant every release was manual and
  # unverified; scripts/deploy/rolling-deploy.sh starts the release, waits for
  # every service to report healthy, and rolls back to the previous image set
  # if any service fails.
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop'
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate the deploy script
        run: bash -n scripts/deploy/rolling-deploy.sh

      - name: Deploy to staging
        env:
          DEPLOY_ENV: staging
          IMAGE_TAG: ${{ github.sha }}
          HEALTH_TIMEOUT_SECONDS: '180'
        run: scripts/deploy/rolling-deploy.sh

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate the deploy script
        run: bash -n scripts/deploy/rolling-deploy.sh

      - name: Deploy to production
        env:
          DEPLOY_ENV: production
          IMAGE_TAG: ${{ github.sha }}
          HEALTH_TIMEOUT_SECONDS: '300'
        run: scripts/deploy/rolling-deploy.sh

  # ============== Notify ==============
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Notify on failure
        if: failure()
        run: echo "Pipeline failed - notify team"
