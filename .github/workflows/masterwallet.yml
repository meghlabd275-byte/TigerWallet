# TigerWallet MasterWallet CI/CD Pipeline
# Comprehensive GitHub Actions workflows for all services
# 
# This workflow covers:
# - Rust backend services (masterwallet_fetchers, userwallet_fetchers)
# - Go backend services (all microservices)
# - C++ components (security, matching engine)
# - Frontend builds (React, Flutter)
# - Security scanning
# - Performance testing

name: MasterWallet CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'master_wallet/**'
      - 'rust/masterwallet_fetchers/**'
      - 'security/**'
      - '.github/workflows/masterwallet.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'master_wallet/**'
      - 'rust/masterwallet_fetchers/**'
      - 'security/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ========================================================================
  # RUST BACKEND TESTS
  # ========================================================================
  
  rust-tests:
    name: Rust Tests (${{ matrix.job }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - masterwallet_fetchers
          - userwallet_fetchers
          - security
          - trading_core
          - transaction_engine
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './${{ matrix.job }} -> target'
      
      - name: Check formatting
        working-directory: ./${{ matrix.job }}
        run: cargo fmt --all -- --check
      
      - name: Run clippy
        working-directory: ./${{ matrix.job }}
        run: cargo clippy -- -D warnings
      
      - name: Run tests
        working-directory: ./${{ matrix.job }}
        run: cargo test --verbose
      
      - name: Build release
        working-directory: ./${{ matrix.job }}
        run: cargo build --release

  # ========================================================================
  # GO BACKEND TESTS
  # ========================================================================
  
  go-tests:
    name: Go Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - master_wallet/go/cmd/master_wallet_service
          - user_wallet/go
          - admin_platform/go
          - api_gateway/go
          - backend_services/go
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Get dependencies
        working-directory: ./${{ matrix.service }}
        run: go mod download
      
      - name: Build
        working-directory: ./${{ matrix.service }}
        run: go build -v ./...
      
      - name: Run tests
        working-directory: ./${{ matrix.service }}
        run: go test -v -race -coverprofile=coverage.out ./...
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-${{ matrix.service }}
          path: ./${{ matrix.service }}/coverage.out

  # ========================================================================
  # C++ BUILD AND TEST
  # ========================================================================
  
  cpp-build:
    name: C++ Build (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - security/hardware_wallet/cpp
          - security/kyc_aml/cpp
          - trading_engine/cpp
          - wallet_core/cpp
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev libusb-1.0-0-dev libpq-dev
      
      - name: Create build directory
        run: mkdir -p ${{ matrix.component }}/build && cd ${{ matrix.component }}/build
      
      - name: Configure
        working-directory: ${{ matrix.component }}/build
        run: cmake .. -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        working-directory: ${{ matrix.component }}/build
        run: make -j$(nproc)
      
      - name: Run tests
        working-directory: ${{ matrix.component }}/build
        run: ctest --output-on-failure

  # ========================================================================
  # DOCKER BUILD AND PUSH
  # ========================================================================
  
  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [rust-tests, go-tests, cpp-build]
    strategy:
      fail-fast: false
      matrix:
        service:
          - master-wallet
          - user-wallet
          - admin-backend
          - api-gateway
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: tigerwallet/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================================
  # SECURITY SCANNING
  # ========================================================================
  
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [rust-tests, go-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run Bandit security scan (Python)
        if: false  # No Python components
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-results.json
      
      - name: Run SonarCloud scan
        if: false  # Requires SonarCloud token
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ========================================================================
  # PERFORMANCE TESTS
  # ========================================================================
  
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [rust-tests, go-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Rust benchmarks
        run: |
          cargo bench --no-run || true
      
      - name: Run Go benchmarks
        run: |
          cd master_wallet/go/cmd/master_wallet_service
          go test -bench=. -benchmem || true
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            **/bench.txt
            **/bench.out

  # ========================================================================
  # LINTING
  # ========================================================================
  
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run super-linter
        uses: github/super-linter@v4
        env:
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Enable specific linters
          VALIDATE_RUST: true
          VALIDATE_GO: true
          VALIDATE_CPP: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_Markdown: true

  # ========================================================================
  # DATABASE MIGRATION TESTS
  # ========================================================================
  
  database-tests:
    name: Database Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tigerwallet_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run database migrations
        run: |
          # Run migration tests against test database
          export DATABASE_URL="postgres://postgres:postgres@localhost:5432/tigerwallet_test"
          # Add migration test commands here
      
      - name: Run schema validation
        run: |
          # Validate all SQL files are syntactically correct
          find . -name "*.sql" -exec echo "Validating {}" \;

  # ========================================================================
  # INTEGRATION TESTS
  # ========================================================================
  
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run integration tests
        run: |
          # Start services with docker-compose
          docker-compose -f docker-compose.test.yml up -d
          
          # Wait for services to be ready
          sleep 30
          
          # Run integration tests
          # Add integration test commands here
          
          # Cleanup
          docker-compose -f docker-compose.test.yml down

  # ========================================================================
  # DEPLOY TO STAGING (on main branch push)
  # ========================================================================
  
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [integration-tests, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to staging
        run: |
          # Add staging deployment commands
          echo "Deploying to staging environment..."
          # kubectl apply -f k8s/staging/
      
      - name: Verify deployment
        run: |
          # Verify services are running
          echo "Verifying staging deployment..."
          # kubectl rollout status deployment/master-wallet-staging

  # ========================================================================
  # NOTIFICATION
  # ========================================================================
  
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: always()
    steps:
      - name: Send notification on failure
        if: failure()
        run: |
          # Send Slack notification on failure
          echo "Sending failure notification..."
      
      - name: Send success notification
        if: success()
        run: |
          # Send Slack notification on success
          echo "Sending success notification..."
