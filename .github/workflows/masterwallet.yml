# TigerWallet MasterWallet CI/CD Pipeline
#
# This workflow covers:
# - Rust crates (rust/security, rust/*_fetchers, rust/trading_core,
#   rust/transaction_engine, fetcher_core/rust)
# - Go services (master wallet, wallet API, admin, super admin)
# - C++ components (wallet core, hardware wallet, trading engine, admin consoles)
# - Security scanning
#
# Formatting is checked with `cargo fmt --check` and `gofmt -l`; clippy runs as a
# report rather than a gate, because the existing crates carry stylistic lints
# that are unrelated to correctness.

name: MasterWallet CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'master_wallet/**'
      - 'rust/**'
      - 'fetcher_core/**'
      - 'security/**'
      - 'super_admin/**'
      - 'admin/**'
      - 'cpp/**'
      - 'hardware_wallet/**'
      - 'mev_protection/**'
      - 'go/wallet_api/**'
      - '.github/workflows/masterwallet.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'master_wallet/**'
      - 'rust/**'
      - 'fetcher_core/**'
      - 'security/**'
      - 'super_admin/**'
      - 'admin/**'
      - 'cpp/**'
      - 'hardware_wallet/**'
      - 'mev_protection/**'
      - 'go/wallet_api/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ========================================================================
  # RUST TESTS
  # ========================================================================

  rust-tests:
    name: Rust Tests (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - rust/security
          - rust/masterwallet_fetchers
          - rust/userwallet_fetchers
          - rust/admin_fetchers
          - rust/trading_core
          - rust/transaction_engine
          - fetcher_core/rust

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.crate }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.crate)) }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.crate }}-

      - name: Check formatting
        working-directory: ./${{ matrix.crate }}
        run: cargo fmt --all -- --check

      - name: Run clippy (report only)
        working-directory: ./${{ matrix.crate }}
        run: cargo clippy --all-targets || true

      - name: Run tests
        working-directory: ./${{ matrix.crate }}
        run: cargo test --verbose

      - name: Build release
        working-directory: ./${{ matrix.crate }}
        run: cargo build --release

  # ========================================================================
  # GO TESTS
  # ========================================================================

  go-tests:
    name: Go Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - master_wallet/backend
          - go/wallet_api
          - admin/go
          - super_admin/go

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get dependencies
        working-directory: ./${{ matrix.service }}
        run: go mod download

      - name: Build
        working-directory: ./${{ matrix.service }}
        run: go build -v ./...

      - name: Vet
        working-directory: ./${{ matrix.service }}
        run: go vet ./...

      - name: Run tests
        working-directory: ./${{ matrix.service }}
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-${{ strategy.job-index }}
          path: ${{ matrix.service }}/coverage.out

  # ========================================================================
  # SUPER ADMIN TESTS (real PostgreSQL)
  # ========================================================================

  super-admin-tests:
    name: Super Admin Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tigerwallet_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        working-directory: ./super_admin/go
        run: go build ./...

      - name: Vet
        working-directory: ./super_admin/go
        run: go vet ./...

      # TEST_DATABASE_URL makes the SLA and backup integration tests run their
      # real SQL against the service database. Without it they skip, which would
      # leave the aggregation and the backup round trip unchecked.
      - name: Run tests
        working-directory: ./super_admin/go
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tigerwallet_test?sslmode=disable
        run: go test -v -race ./...

  # ========================================================================
  # C++ BUILD AND TEST
  # ========================================================================

  cpp-build:
    name: C++ Build (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - cpp/core
          - cpp/trading_engine_ultra
          - hardware_wallet/cpp
          - mev_protection/cpp
          - master_wallet/desktop
          - admin/cpp
          - super_admin/cpp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev libcurl4-openssl-dev libsecp256k1-dev pkg-config

      - name: Configure
        run: cmake -S ${{ matrix.component }} -B ${{ matrix.component }}/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build ${{ matrix.component }}/build --parallel

      - name: Run tests
        working-directory: ${{ matrix.component }}/build
        run: ctest --output-on-failure

  # ========================================================================
  # SECURITY SCANNING
  # ========================================================================

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [rust-tests, go-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject committed secrets
        run: |
          if grep -rInE "(PRIVATE_KEY|MNEMONIC|SEED_PHRASE|JWT_SECRET|ENCRYPTION_KEY)=[^[:space:]]+" \
               --include='*.go' --include='*.rs' --include='*.ts' --include='*.tsx' \
               --exclude-dir=node_modules --exclude-dir=vendor .; then
            echo "::error title=Committed secret::A literal credential assignment was found"
            exit 1
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  # ========================================================================
  # PERFORMANCE TESTS
  # ========================================================================

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [rust-tests, go-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go benchmarks
        working-directory: ./master_wallet/backend
        run: go test -bench=. -benchmem ./... || true
