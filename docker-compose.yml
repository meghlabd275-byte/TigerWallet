version: '3.8'

services:
  # PostgreSQL Database (canonical datastore — replaces all SQLite/in-memory)
  postgres:
    image: postgres:15-alpine
    container_name: tigerwallet-postgres
    environment:
      POSTGRES_USER: tigerwallet
      POSTGRES_PASSWORD: tigerwallet
      POSTGRES_DB: tigerwallet_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tigerwallet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (hot cache for balances, prices, gas)
  redis:
    image: redis:7-alpine
    container_name: tigerwallet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TigerWallet Wallet API — canonical backend (Go). Real BIP-39/32/44 HD
  # wallet, secp256k1 signing, EVM broadcast, on-chain fetchers, PostgreSQL
  # persistence, Redis cache.
  wallet-api:
    build:
      context: ./go/wallet_api
      dockerfile: Dockerfile
    container_name: tigerwallet-wallet-api
    ports:
      - "8443:8443"
    environment:
      WALLET_API_PORT: "8443"
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      ETHERSCAN_API_KEY: "${ETHERSCAN_API_KEY:-}"
      COINGECKO_API_KEY: "${COINGECKO_API_KEY:-}"
      # Upstream DeFi/utility services proxied through /api/v1/* (defi_proxy.go).
      LENDING_SERVICE_URL: "http://lending-service:8009"
      COPYTRADING_SERVICE_URL: "http://copy-trading-service:8006"
      GOVERNANCE_SERVICE_URL: "http://governance-service:8454"
      PREDICTION_SERVICE_URL: "http://prediction-service:8455"
      BRIDGE_SERVICE_URL: "http://bridge-api:8007"
      DAPP_BROWSER_SERVICE_URL: "http://dapp-browser:8083"
      CARD_SERVICE_URL: "http://card-service:8457"
      FIAT_RAMP_SERVICE_URL: "http://fiat-ramp-service:8451"
      P2P_SERVICE_URL: "http://p2p-service:8475"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # TigerWallet Next.js Frontend
  wallet-frontend:
    build:
      context: ./frontend/web_nextjs
      dockerfile: Dockerfile
    container_name: tigerwallet-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://wallet-api:8443"
      BACKEND_URL: "http://wallet-api:8443"
    depends_on:
      - wallet-api
    restart: unless-stopped

  # Super Admin API (has Dockerfile)
  super-admin-api:
    build:
      context: ./super_admin/go
      dockerfile: Dockerfile
    container_name: tigerwallet-super-admin-api
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: tigerwallet
      DB_PASSWORD: tigerwallet
      DB_NAME: tigerwallet_admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: "${ADMIN_JWT_SECRET:-change-me-in-production}"
      SUPER_ADMIN_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Admin Panel API (GORM persistence, trading pairs + liquidity management)
  admin-api:
    build:
      context: ./admin/go
      dockerfile: Dockerfile
    container_name: tigerwallet-admin-api
    ports:
      - "9093:9093"
    environment:
      ADMIN_PORT: "9093"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: tigerwallet
      DB_PASSWORD: tigerwallet
      DB_NAME: tigerwallet_admin
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${ADMIN_JWT_SECRET:-change-me-in-production}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ProjectParty API (token listing + launchpad platform, pgx persistence)
  project-party-api:
    build:
      context: ./project_party
      dockerfile: Dockerfile
    container_name: tigerwallet-project-party-api
    ports:
      - "8106:8106"
    environment:
      PROJECT_PARTY_PORT: "8106"
      PROJECT_PARTY_DB_HOST: postgres
      PROJECT_PARTY_DB_PORT: 5432
      PROJECT_PARTY_DB_USER: tigerwallet
      PROJECT_PARTY_DB_PASSWORD: tigerwallet
      PROJECT_PARTY_DB_NAME: tigerwallet_project_party
      PROJECT_PARTY_REDIS_ADDR: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Bridge Service — cross-chain bridge (Go/Gin + pgx). Port 8007.
  bridge-api:
    build:
      context: ./go/bridge_service
      dockerfile: Dockerfile
    container_name: tigerwallet-bridge-api
    ports:
      - "8007:8007"
    environment:
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet_bridge?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # UserWallet auxiliary services — proxied through wallet-api (:8443) so every
  # UserWallet client reaches the full DeFi/utility surface via one port.
  # JWT_SECRET must match wallet-api so proxied Bearer tokens validate upstream.
  # ---------------------------------------------------------------------------

  lending-service:
    build:
      context: ./go/lending_service
      dockerfile: Dockerfile
    container_name: tigerwallet-lending-service
    ports:
      - "8009:8009"
    environment:
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      ETHEREUM_RPC_URL: "${ETHEREUM_RPC_URL:-https://ethereum.publicnode.com}"
      WALLET_API_URL: "http://wallet-api:8443"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  copy-trading-service:
    build:
      context: ./go/copy_trading_service
      dockerfile: Dockerfile
    container_name: tigerwallet-copy-trading-service
    ports:
      - "8006:8006"
    environment:
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  governance-service:
    build:
      context: ./go/governance_service
      dockerfile: Dockerfile
    container_name: tigerwallet-governance-service
    ports:
      - "8454:8454"
    environment:
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  prediction-service:
    build:
      context: ./go/prediction_service
      dockerfile: Dockerfile
    container_name: tigerwallet-prediction-service
    ports:
      - "8455:8455"
    environment:
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  p2p-service:
    build:
      context: ./go/p2p_trading
      dockerfile: Dockerfile
    container_name: tigerwallet-p2p-service
    ports:
      - "8475:8475"
    environment:
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  fiat-ramp-service:
    build:
      context: ./go/fiat_ramp
      dockerfile: Dockerfile
    container_name: tigerwallet-fiat-ramp-service
    ports:
      - "8451:8451"
    environment:
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      TRANSAK_ENV: "${TRANSAK_ENV:-staging}"
      TRANSAK_API_KEY: "${TRANSAK_API_KEY:-}"
      MOONPAY_API_KEY: "${MOONPAY_API_KEY:-}"
      COINGECKO_API_KEY: "${COINGECKO_API_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  card-service:
    build:
      context: ./go/card_service
      dockerfile: Dockerfile
    container_name: tigerwallet-card-service
    ports:
      - "8457:8457"
    environment:
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      COINGECKO_API_KEY: "${COINGECKO_API_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  dapp-browser:
    build:
      context: ./dapp_browser/go
      dockerfile: Dockerfile
    container_name: tigerwallet-dapp-browser
    ports:
      - "8083:8083"
    environment:
      WC_SERVER_PORT: "8083"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "tigerwallet"
      DB_PASSWORD: "tigerwallet"
      DB_NAME: "walletconnect"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      WC_PROJECT_ID: "${WC_PROJECT_ID:-}"
      WC_SIGNER_PRIVATE_KEY: "${WC_SIGNER_PRIVATE_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # White Label API — backend (Go/Gin + pgx + Redis). Serves the
  # /api/v1/* contract consumed by white-label-frontend (auth, dashboard,
  # clients, admins, products, pairs, blockchains, audit-logs, notifications)
  # plus the legacy /api/v1/white-label/* CRUD routes. Port 8095 is chosen to
  # avoid the admin-frontend nginx port (8090) collision.
  white-label-api:
    build:
      context: ./white_label/go
      dockerfile: Dockerfile
    container_name: tigerwallet-white-label-api
    ports:
      - "8095:8095"
    environment:
      PORT: "8095"
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${WHITE_LABEL_JWT_SECRET:-change-me-in-production}"
      SUPER_ADMIN: "admin"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # White Label Frontend (has Dockerfile)
  white-label-frontend:
    build:
      context: ./white_label/frontend
      dockerfile: Dockerfile
      args:
        # Build-time API URL baked into the SPA. Browser reaches the API via
        # the host port (3001 frontend, 8095 API); both are published below.
        VITE_API_URL: "http://localhost:8095/api/v1"
    container_name: tigerwallet-white-label-frontend
    ports:
      - "3001:80"
    depends_on:
      - white-label-api
    restart: unless-stopped

  # Admin Panel Frontend (Vite + React)
  admin-frontend:
    build:
      context: ./admin/web
      dockerfile: Dockerfile
    container_name: tigerwallet-admin-frontend
    ports:
      - "8090:80"
    depends_on:
      - admin-api
    restart: unless-stopped

  # Super Admin Frontend (Vite + React)
  super-admin-frontend:
    build:
      context: ./super_admin/web
      dockerfile: Dockerfile
    container_name: tigerwallet-super-admin-frontend
    ports:
      - "8091:80"
    depends_on:
      - super-admin-api
    restart: unless-stopped

  # ProjectParty Frontend (Vite + React)
  project-party-frontend:
    build:
      context: ./project_party/web
      dockerfile: Dockerfile
    container_name: tigerwallet-project-party-frontend
    ports:
      - "8107:80"
    depends_on:
      - project-party-api
    restart: unless-stopped


  # Permission Service (has Dockerfile)
  permission-service:
    build:
      context: ./permission_service
      dockerfile: go/Dockerfile
    container_name: tigerwallet-permission-service
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      JWT_SECRET: "${ADMIN_JWT_SECRET:-change-me-in-production}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Connection API (has Dockerfile)
  connection-api:
    build:
      context: ./connection_api
      dockerfile: go/Dockerfile
    container_name: tigerwallet-connection-api
    ports:
      - "8086:8086"
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Fetcher Gateway (Rust, has Dockerfile)
  fetcher-gateway:
    build:
      context: ./fetcher_gateway/rust
      dockerfile: Dockerfile
    container_name: tigerwallet-fetcher-gateway
    ports:
      - "8093:8093"
    environment:
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Monitoring Dashboard (has Dockerfile)
  monitoring-dashboard:
    build:
      context: ./monitoring_dashboard
      dockerfile: go/Dockerfile
    container_name: tigerwallet-monitoring-dashboard
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Airdrop Service
  airdrop-service:
    build:
      context: ./go/airdrop_service
      dockerfile: Dockerfile
    container_name: tigerwallet-airdrop
    ports:
      - "8465:8465"
    environment:
      - PORT=8465
      - DATABASE_URL=postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Earn Service
  earn-service:
    build:
      context: ./go/earn_service
      dockerfile: Dockerfile
    container_name: tigerwallet-earn
    ports:
      - "8466:8466"
    environment:
      - PORT=8466
      - DATABASE_URL=postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Coupon Service
  coupon-service:
    build:
      context: ./go/coupon_service
      dockerfile: Dockerfile
    container_name: tigerwallet-coupon
    ports:
      - "8467:8467"
    environment:
      - PORT=8467
      - DATABASE_URL=postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Red Packets Service
  red-packets-service:
    build:
      context: ./go/red_packets_service
      dockerfile: Dockerfile
    container_name: tigerwallet-red-packets
    ports:
      - "8468:8468"
    environment:
      - PORT=8468
      - DATABASE_URL=postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # TigerWallet Bot Platform API — canonical bot backend (Go). Real PostgreSQL +
  # Redis bot lifecycle (create/start/stop/pause/delete), 18 bot types, 4
  # subscription tiers, fee configs, admin fee addresses, CEX/DEX connectors,
  # per-user API keys, admin management + platform stats. JWT auth with RBAC.
  # No in-memory stubs, no fake data. Runs on port 8471.
  bot-api:
    build:
      context: ./mm_bot_platform/bot_api
      dockerfile: Dockerfile
    container_name: tigerwallet-bot-api
    ports:
      - "8471:8471"
    environment:
      PORT: "8471"
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # TigerWallet Bots Service — DEPRECATED reverse-proxy shim to bot-api.
  # Proxies every request to the canonical bot_api (bot-api:8471). Serves a
  # local /health deprecation notice. Unique port 8108 (NOT 8107, which is
  # already mapped by project-party-frontend). No fake data; every response is
  # the real bot_api response.
  bots-service:
    build:
      context: ./bots/go
      dockerfile: Dockerfile
    container_name: tigerwallet-bots-service
    ports:
      - "8108:8108"
    environment:
      BOTS_PORT: "8108"
      BOT_API_URL: "http://bot-api:8471"
    depends_on:
      - bot-api
    restart: unless-stopped

  # ===== White-label control plane =====
  # The license control plane (SuperAdmin kill-switch / feature flags /
  # two-party withdrawal gate). WL products phone home to this on heartbeat.
  license-service:
    build:
      context: ./license_service/go
      dockerfile: Dockerfile
    container_name: tigerwallet-license-service
    ports:
      - "8460:8460"
    environment:
      LICENSE_PORT: "8460"
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET:-tigerwallet-license-secret-change-me}"
      GATE_ED25519_PUBLIC_KEY: "${GATE_ED25519_PUBLIC_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ===== Kill-switch control plane =====
  # Emergency halt/resume for the whole platform, one WL client, one product,
  # or one fetcher. Durable state in PostgreSQL, sub-second propagation via
  # Redis keys + pub/sub; license-service heartbeats consult the same Redis
  # keys and fail closed. SuperAdmin JWT only.
  kill-switch:
    build:
      context: ./kill_switch
      dockerfile: Dockerfile
    container_name: tigerwallet-kill-switch
    ports:
      - "8469:8469"
    environment:
      PORT: "8469"
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET:-tigerwallet-license-secret-change-me}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ===== Standalone WL-UserWallet backend =====
  # Runs INDEPENDENTLY in the WL client's own environment. Own PG, own signing,
  # own DB. Phones home to license-service on heartbeat (fail-closed).
  wl-user-wallet:
    build:
      context: ./wl_user_wallet/go
      dockerfile: Dockerfile
    container_name: tigerwallet-wl-user-wallet
    ports:
      - "8461:8443"
    environment:
      PORT: "8443"
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/wl_userwallet?sslmode=disable"
      JWT_SECRET: "${WL_JWT_SECRET:-wl-user-wallet-jwt-secret-change-me}"
      WL_CLIENT_ID: "${WL_CLIENT_ID}"
      WL_LICENSE_KEY: "${WL_LICENSE_KEY}"
      WL_PRODUCT: "user_wallet"
      WL_INSTANCE_ID: "wl-user-wallet-1"
      TWO_PARTY_GATE_URL: "http://license-service:8460"
      TWO_PARTY_GATE_TOKEN: "${WL_GATE_TOKEN:-}"
      HEARTBEAT_INTERVAL: "30s"
    depends_on:
      postgres:
        condition: service_healthy
      license-service:
        condition: service_started
    restart: unless-stopped

  # ===== Standalone WL-MasterWallet backend =====
  # Independent WL clone of TigerWallet MasterWallet. Own PG, own BIP-39/32/44
  # signing, fail-closed gate + heartbeat. Two-party withdrawal gate on sends.
  wl-master-wallet:
    build:
      context: ./wl_master_wallet/go
      dockerfile: Dockerfile
    container_name: tigerwallet-wl-master-wallet
    ports:
      - "8462:8450"
    environment:
      PORT: "8450"
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/wl_masterwallet?sslmode=disable"
      JWT_SECRET: "${WL_MW_JWT_SECRET:-wl-master-wallet-jwt-secret-change-me}"
      WL_CLIENT_ID: "${WL_CLIENT_ID}"
      WL_LICENSE_KEY: "${WL_MW_LICENSE_KEY}"
      WL_PRODUCT: "master_wallet"
      WL_INSTANCE_ID: "wl-master-wallet-1"
      TWO_PARTY_GATE_URL: "http://license-service:8460"
      TWO_PARTY_GATE_TOKEN: "${WL_GATE_TOKEN:-}"
      HEARTBEAT_INTERVAL: "30s"
    depends_on:
      postgres:
        condition: service_healthy
      license-service:
        condition: service_started
    restart: unless-stopped

  # ===== Standalone WL-Bots backend =====
  # Independent WL clone of TigerWallet Bots platform. Own PG, bot lifecycle,
  # AES-GCM API key encryption, fail-closed gate + heartbeat.
  wl-bots:
    build:
      context: ./wl_bots/go
      dockerfile: Dockerfile
    container_name: tigerwallet-wl-bots
    ports:
      - "8463:8471"
    environment:
      PORT: "8471"
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/wl_bots?sslmode=disable"
      JWT_SECRET: "${WL_BOTS_JWT_SECRET:-wl-bots-jwt-secret-change-me}"
      WL_CLIENT_ID: "${WL_CLIENT_ID}"
      WL_LICENSE_KEY: "${WL_BOTS_LICENSE_KEY}"
      WL_PRODUCT: "bots"
      WL_INSTANCE_ID: "wl-bots-1"
      TWO_PARTY_GATE_URL: "http://license-service:8460"
      TWO_PARTY_GATE_TOKEN: "${WL_GATE_TOKEN:-}"
      HEARTBEAT_INTERVAL: "30s"
    depends_on:
      postgres:
        condition: service_healthy
      license-service:
        condition: service_started
    restart: unless-stopped

  # ===== Standalone WL-ProjectParty backend =====
  # Independent WL clone of TigerWallet ProjectParty (token listing/launchpad).
  # Own PG, fail-closed gate + heartbeat.
  wl-project-party:
    build:
      context: ./wl_project_party/go
      dockerfile: Dockerfile
    container_name: tigerwallet-wl-project-party
    ports:
      - "8464:8106"
    environment:
      PORT: "8106"
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/wl_projectparty?sslmode=disable"
      JWT_SECRET: "${WL_PP_JWT_SECRET:-wl-project-party-jwt-secret-change-me}"
      WL_CLIENT_ID: "${WL_CLIENT_ID}"
      WL_LICENSE_KEY: "${WL_PP_LICENSE_KEY}"
      WL_PRODUCT: "project_party"
      WL_INSTANCE_ID: "wl-project-party-1"
      TWO_PARTY_GATE_URL: "http://license-service:8460"
      TWO_PARTY_GATE_TOKEN: "${WL_GATE_TOKEN:-}"
      HEARTBEAT_INTERVAL: "30s"
    depends_on:
      postgres:
        condition: service_healthy
      license-service:
        condition: service_started

  wl-liquidity:
    build:
      context: ./wl_liquidity/go
      dockerfile: Dockerfile
    container_name: tigerwallet-wl-liquidity
    ports:
      - "8458:8462"
    environment:
      LIQ_PORT: "8462"
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/wl_liquidity?sslmode=disable"
      JWT_SECRET: "${WL_LIQ_JWT_SECRET:-wl-liquidity-jwt-secret-change-me}"
      WL_CLIENT_ID: "${WL_CLIENT_ID}"
      WL_LICENSE_KEY: "${WL_LIQ_LICENSE_KEY}"
      WL_PRODUCT: "liquidity"
      WL_INSTANCE_ID: "wl-liquidity-1"
      TWO_PARTY_GATE_URL: "http://license-service:8460"
      TWO_PARTY_GATE_TOKEN: "${WL_GATE_TOKEN:-}"
      HEARTBEAT_INTERVAL: "30s"
    depends_on:
      postgres:
        condition: service_healthy
      license-service:
        condition: service_started

  wl-card:
    build:
      context: ./wl_card/go
      dockerfile: Dockerfile
    container_name: tigerwallet-wl-card
    ports:
      - "8459:8463"
    environment:
      CARD_PORT: "8463"
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/wl_card?sslmode=disable"
      JWT_SECRET: "${WL_CARD_JWT_SECRET:-wl-card-jwt-secret-change-me}"
      CARD_ENC_KEY: "${WL_CARD_ENC_KEY:-wl-card-enc-key-change-me}"
      WL_CLIENT_ID: "${WL_CLIENT_ID}"
      WL_LICENSE_KEY: "${WL_CARD_LICENSE_KEY}"
      WL_PRODUCT: "card"
      WL_INSTANCE_ID: "wl-card-1"
      TWO_PARTY_GATE_URL: "http://license-service:8460"
      TWO_PARTY_GATE_TOKEN: "${WL_GATE_TOKEN:-}"
      HEARTBEAT_INTERVAL: "30s"
    depends_on:
      postgres:
        condition: service_healthy
      license-service:
        condition: service_started
    restart: unless-stopped

  # ===== Standalone WL Admin Panel backend =====
  # Independent WL clone of the TigerWallet admin panel, self-hosted in the WL
  # client's own environment. Own PG + Redis, fail-closed gate + heartbeat.
  # NOTE: build context needs the wl_shared sibling (see go.mod replace); run
  # from the repo root or provide the sibling in the build context.
  wl-admin:
    build:
      context: ./white_label_admin/go
      dockerfile: Dockerfile
    container_name: tigerwallet-wl-admin
    ports:
      - "8456:8082"
    environment:
      SERVER_PORT: "8082"
      DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/wl_admin?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${WL_ADMIN_JWT_SECRET:-wl-admin-jwt-secret-change-me}"
      WL_CLIENT_ID: "${WL_CLIENT_ID}"
      LICENSE_KEY: "${WL_ADMIN_LICENSE_KEY}"
      WL_PRODUCT: "white_label_admin"
      TWO_PARTY_GATE_URL: "http://license-service:8460"
      TWO_PARTY_GATE_TOKEN: "${WL_GATE_TOKEN:-}"
      HEARTBEAT_INTERVAL: "30s"
    depends_on:
      postgres:
        condition: service_healthy
      license-service:
        condition: service_started
    restart: unless-stopped

  # ===== Bots frontend (Vite + React) =====
  bots-frontend:
    build:
      context: ./bots/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: tigerwallet-bots-frontend
    ports:
      - "8472:80"
    depends_on:
      - wl-bots
    restart: unless-stopped

  # ===== Canonical MasterWallet backend (Go, :8450) =====
  # The single source of truth for the MasterWallet REST contract. HD wallet
  # custody, sub-wallets, multisig, treasury, policies/fees/auto-sign, and the
  # UserWallet governance surface (user-chains/user-tokens/derive/auto-sign/
  # feature-flags). PostgreSQL persistence + Redis cache; seeded 120 EVM + 66
  # non-EVM chains. nginx in master_wallet/web proxies /api/ to this service.
  master-wallet-backend:
    build:
      context: ./master_wallet/backend
      dockerfile: Dockerfile
    container_name: tigerwallet-master-wallet-backend
    ports:
      - "8450:8450"
    environment:
      MASTER_WALLET_PORT: "8450"
      MASTER_WALLET_DATABASE_URL: "postgres://tigerwallet:tigerwallet@postgres:5432/tigerwallet?sslmode=disable"
      MASTER_WALLET_REDIS_ADDR: "redis:6379"
      MASTER_WALLET_REDIS_PASSWORD: ""
      MASTER_WALLET_REDIS_DB: "0"
      MASTER_WALLET_JWT_SECRET: "${MASTER_WALLET_JWT_SECRET:-tigerwallet-master-jwt-change-in-production}"
      COINGECKO_API_KEY: "${COINGECKO_API_KEY:-}"
      ETHERSCAN_API_KEY: "${ETHERSCAN_API_KEY:-}"
      MASTER_WALLET_TREASURY_KEY_HEX: "${MASTER_WALLET_TREASURY_KEY_HEX:-}"
      MASTER_WALLET_BUNDLER_URL: "${MASTER_WALLET_BUNDLER_URL:-}"
      MASTER_WALLET_PAYMASTER_URL: "${MASTER_WALLET_PAYMASTER_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ===== MasterWallet frontend (Vite + React) =====
  master-wallet-frontend:
    build:
      context: ./master_wallet/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: tigerwallet-master-wallet-frontend
    ports:
      - "8452:80"
    depends_on:
      - master-wallet-backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    driver: bridge
