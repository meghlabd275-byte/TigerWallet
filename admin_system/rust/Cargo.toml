[package]
name = "tiger-admin"
version = "1.0.0"
edition = "2021"
description = "TigerWallet Admin - High Performance Rust Backend"
authors = ["TigerWallet Team"]
license = "MIT"

[dependencies]
axum = "0.7.4"
tower = "0.4.13"
tower-http = { version = "0.5.1", features = ["cors", "trace"] }
tokio = { version = "1.35.1", features = ["full"] }
sqlx = { version = "0.8.0", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }
redis = { version = "0.26.0", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
jsonwebtoken = "9.3.0"
bcrypt = "0.15.1"
uuid = { version = "1.7.0", features = ["v4", "serde"] }
chrono = { version = "0.4.33", features = ["serde"] }
thiserror = "1.0.56"
anyhow = "1.0.79"
async-trait = "0.1.77"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tokio-tungstenite = "0.21.0"
futures-util = "0.3.30"
reqwest = { version = "0.11.23", features = ["json"] }

[lib]
name = "tiger_admin"
path = "src/lib.rs"

[[bin]]
name = "tiger-admin-server"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
