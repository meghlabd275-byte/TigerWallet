[package]
name = "tiger-mpc"
version = "1.0.0"
edition = "2021"
description = "TigerWallet MPC - Real cryptographic multi-party computation module"

[dependencies]
# Cryptographic libraries
k256 = { version = "0.13", features = ["ecdsa", "sha2", "arithmetic"] }
sha2 = "0.10"
digest = "0.10"
hex = "0.4"
rand = "0.8"
uuid = { version = "1.6", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
thiserror = "1.0"

[features]
default = ["std"]
std = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
