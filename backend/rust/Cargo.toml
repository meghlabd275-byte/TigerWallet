[package]
name = "tigerwallet-security"
version = "1.0.0"
edition = "2021"
description = "Security-critical operations for TigerWallet"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.21"
hmac = "0.12"
constant_time_eq = "0.3"

[lib]
name = "security"
path = "src/lib.rs"

[[bin]]
name = "security-tool"
path = "src/main.rs"
