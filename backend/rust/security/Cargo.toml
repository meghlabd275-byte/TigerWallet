[package]
name = "tigerwallet-security"
version = "1.0.0"
edition = "2021"
authors = ["TigerWallet Team"]
description = "Security module for TigerWallet - cryptographic operations and secure key management"

[dependencies]
# Cryptography
sha2 = "0.10.8"
sha3 = "0.10.8"
keccak-hash = "0.10.0"
ed25519-dalek = { version = "2.1.0", features = ["rand_core"] }
secp256k1 = { version = "0.28.0", features = ["global-context", "rand"] }
aes-gcm = "0.10.3"
chacha20poly1305 = "0.10.1"
pbkdf2 = { version = "0.12.2", features = ["simple"] }
hmac = "0.12.1"
ripemd160 = "0.10.1"
base58 = "0.2.0"
hex = "0.4.3"
base64 = "0.22.0"
zeroize = { version = "1.7.1", features = ["derive"] }

# Async runtime
tokio = { version = "1.36.0", features = ["full"] }

# Logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Error handling
thiserror = "1.0.56"
anyhow = "1.0.80"

# Serialization
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.116"

# Time
chrono = { version = "0.4.35", features = ["serde"] }

# UUID
uuid = { version = "1.7.0", features = ["v4", "serde"] }

# Database
rocksdb = "0.22.0"

[dev-dependencies]
criterion = "0.5.1"
proptest = "1.4.0"

[[bench]]
name = "crypto_benches"
harness = false
