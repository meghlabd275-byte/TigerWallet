[package]
name = "plugin_system"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4.38"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
