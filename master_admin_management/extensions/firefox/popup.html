<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 320px; padding: 16px; font-family: -apple-system, sans-serif; }
    h1 { font-size: 16px; margin-bottom: 12px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { padding: 12px; background: #f5f5f5; border-radius: 8px; text-align: center; }
    .stat h3 { font-size: 12px; color: #666; }
    .stat p { font-size: 20px; font-weight: bold; margin-top: 4px; }
    .btn { width: 100%; padding: 12px; margin-top: 12px; background: #007bff; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Master Admin</h1>
  <div class="stats">
    <div class="stat"><h3>Total Users</h3><p>0</p></div>
    <div class="stat"><h3>Transactions</h3><p>0</p></div>
    <div class="stat"><h3>System</h3><p>OK</p></div>
    <div class="stat"><h3>Admins</h3><p>0</p></div>
  </div>
  <button class="btn" id="open-dashboard">Open Dashboard</button>
  <script src="popup.js"></script>
</body>
</html>
