<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TigerWallet Master Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body.dark { background: #1a1a1a; color: #fff; }
    body.light { background: #f5f5f5; color: #333; }
    
    .app-container { display: flex; height: 100vh; }
    
    /* Sidebar */
    .sidebar { width: 200px; padding: 20px; border-right: 1px solid #ddd; }
    body.dark .sidebar { background: #2d2d2d; border-color: #444; }
    body.light .sidebar { background: #fff; }
    
    .sidebar h1 { font-size: 18px; margin-bottom: 20px; }
    
    .nav-item {
      padding: 12px 16px;
      margin: 4px 0;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .nav-item:hover { background: rgba(0,0,0,0.05); }
    body.dark .nav-item:hover { background: rgba(255,255,255,0.1); }
    .nav-item.active { background: #007bff; color: #fff; }
    
    /* Main content */
    .main-content { flex: 1; padding: 24px; overflow-y: auto; }
    
    /* Cards */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      padding: 20px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    body.dark .stat-card { background: #2d2d2d; }
    .stat-card h3 { font-size: 14px; color: #666; margin-bottom: 8px; }
    body.dark .stat-card h3 { color: #999; }
    .stat-card p { font-size: 28px; font-weight: bold; }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .header h2 { font-size: 24px; }
    
    .theme-toggle {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #007bff;
      color: #fff;
    }
    
    /* Tables */
    .table-container { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    body.dark .table-container { background: #2d2d2d; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eee; }
    body.dark th, body.dark td { border-color: #444; }
    th { background: #f8f8f8; font-weight: 600; }
    body.dark th { background: #3d3d3d; }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    .badge.active { background: #d4edda; color: #155724; }
    .badge.pending { background: #fff3cd; color: #856404; }
    .badge.inactive { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body class="light">
  <div class="app-container">
    <aside class="sidebar">
      <h1>Master Admin</h1>
      <nav>
        <div class="nav-item active" data-page="dashboard">Dashboard</div>
        <div class="nav-item" data-page="whitelabels">White Labels</div>
        <div class="nav-item" data-page="admins">Master Admins</div>
        <div class="nav-item" data-page="users">Users</div>
        <div class="nav-item" data-page="audit">Audit Logs</div>
        <div class="nav-item" data-page="settings">Settings</div>
      </nav>
    </aside>
    
    <main class="main-content">
      <header class="header">
        <h2 id="page-title">Dashboard</h2>
        <button class="theme-toggle" id="theme-toggle">🌙 Dark Mode</button>
      </header>
      
      <div id="content">
        <!-- Dashboard -->
        <div class="stats-grid">
          <div class="stat-card">
            <h3>Total White Labels</h3>
            <p id="stat-whitelabels">0</p>
          </div>
          <div class="stat-card">
            <h3>Total Users</h3>
            <p id="stat-users">0</p>
          </div>
          <div class="stat-card">
            <h3>Transactions</h3>
            <p id="stat-transactions">0</p>
          </div>
          <div class="stat-card">
            <h3>Pending Approvals</h3>
            <p id="stat-pending">0</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = 'http://localhost:9091';
    let currentPage = 'dashboard';
    let isDarkMode = false;

    // Theme toggle
    document.getElementById('theme-toggle').addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      document.body.className = isDarkMode ? 'dark' : 'light';
      document.getElementById('theme-toggle').textContent = isDarkMode ? '☀️ Light Mode' : '🌙 Dark Mode';
      localStorage.setItem('dark_mode', isDarkMode);
    });

    // Load saved theme
    if (localStorage.getItem('dark_mode') === 'true') {
      isDarkMode = true;
      document.body.className = 'dark';
      document.getElementById('theme-toggle').textContent = '☀️ Light Mode';
    }

    // Navigation
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        currentPage = item.dataset.page;
        document.getElementById('page-title').textContent = item.textContent;
        loadPage(currentPage);
      });
    });

    function loadPage(page) {
      const content = document.getElementById('content');
      switch(page) {
        case 'dashboard':
          content.innerHTML = `
            <div class="stats-grid">
              <div class="stat-card"><h3>Total White Labels</h3><p>0</p></div>
              <div class="stat-card"><h3>Total Users</h3><p>0</p></div>
              <div class="stat-card"><h3>Transactions</h3><p>0</p></div>
              <div class="stat-card"><h3>Pending Approvals</h3><p>0</p></div>
            </div>`;
          break;
        case 'whitelabels':
          content.innerHTML = `<div class="table-container"><table><thead><tr><th>Name</th><th>Domain</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr><td colspan="4">Loading...</td></tr></tbody></table></div>`;
          break;
        case 'admins':
          content.innerHTML = `<div class="table-container"><table><thead><tr><th>Username</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody><tr><td colspan="4">Loading...</td></tr></tbody></table></div>`;
          break;
        case 'users':
          content.innerHTML = `<div class="table-container"><table><thead><tr><th>Email</th><th>White Label</th><th>Status</th><th>KYC</th></tr></thead><tbody><tr><td colspan="4">Loading...</td></tr></tbody></table></div>`;
          break;
        case 'audit':
          content.innerHTML = `<div class="table-container"><table><thead><tr><th>Action</th><th>Resource</th><th>Details</th><th>Time</th></tr></thead><tbody><tr><td colspan="4">Loading...</td></tr></tbody></table></div>`;
          break;
        case 'settings':
          content.innerHTML = `
            <div class="stat-card">
              <h3>Appearance</h3>
              <p style="margin-top:12px">Theme: ${isDarkMode ? 'Dark' : 'Light'}</p>
            </div>
            <div class="stat-card" style="margin-top:16px">
              <h3>About</h3>
              <p style="margin-top:12px">Version: 2.0.0</p>
            </div>`;
          break;
      }
    }

    // Initial load
    loadPage('dashboard');
  </script>
</body>
</html>
