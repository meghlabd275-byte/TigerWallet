[package]
name = "tiger-cloud-recovery"
version = "1.0.0"
edition = "2021"
description = "TigerWallet Cloud Recovery - encrypted wallet backup to iCloud (CloudKit Web Services) and Google Drive"
license = "MIT"

[dependencies]
# Cryptography
argon2 = "0.5"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.21"
hex = "0.4"
zeroize = { version = "1.7", features = ["derive"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Cloud APIs
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
log = "0.4"
rand = "0.8"

[lib]
name = "cloud_recovery"
path = "src/lib.rs"
