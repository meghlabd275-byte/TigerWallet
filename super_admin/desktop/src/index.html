<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>TigerWallet Super Admin</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --fg: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #3b82f6;
      --accent-dark: #1d4ed8;
      --accent-fg: #ffffff;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
      --success: #16a34a;
      --row-hover: #f1f5f9;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --fg: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --accent-dark: #1d4ed8;
      --accent-fg: #ffffff;
      --danger: #f87171;
      --danger-bg: #7f1d1d;
      --success: #4ade80;
      --row-hover: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: grid;
      grid-template-columns: 220px 1fr;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 12px;
      overflow-y: auto;
    }
    .brand {
      font-size: 16px;
      font-weight: 700;
      padding: 8px 4px 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .nav-section {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.05em;
      padding: 12px 4px 4px;
    }
    .nav-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      margin: 2px 0;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: var(--fg);
      cursor: pointer;
      font-size: 13px;
    }
    .nav-item:hover { background: var(--row-hover); }
    .nav-item.active { background: var(--accent); color: var(--accent-fg); }

    /* Main content */
    .main { padding: 16px 24px; overflow-y: auto; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .topbar h1 { font-size: 20px; font-weight: 700; }
    .token-bar { display: flex; gap: 6px; align-items: center; }
    .token-bar input {
      width: 280px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--fg);
      font-size: 12px;
    }
    .btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--fg);
      cursor: pointer;
      font-size: 12px;
    }
    .btn:hover { background: var(--row-hover); }
    .btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .btn-danger { color: var(--danger); border-color: var(--danger); }

    .screen { display: none; }
    .screen.active { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .toolbar .count { font-size: 12px; color: var(--muted); }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
    th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
    tbody tr:hover { background: var(--row-hover); }
    td.actions { white-space: nowrap; }

    .state { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }
    .state.error { color: var(--danger); }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: var(--row-hover); color: var(--fg); }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: none; align-items: center; justify-content: center; z-index: 10;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      background: var(--surface); color: var(--fg);
      border: 1px solid var(--border); border-radius: 8px;
      width: 480px; max-width: 90vw; padding: 16px;
    }
    .modal h3 { margin-bottom: 12px; }
    .form-row { margin-bottom: 10px; }
    .form-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .form-row input, .form-row textarea, .form-row select {
      width: 100%; padding: 6px 8px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--surface); color: var(--fg); font-size: 13px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">🐯 TigerWallet</div>
    <div class="nav-section">Governance</div>
    <nav id="domainNav"></nav>
    <div class="nav-section">System</div>
    <button class="nav-item" id="themeToggleBtn">🌓 Toggle Theme</button>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="screenTitle">Super Admin</h1>
      <div class="token-bar">
        <input id="tokenInput" type="password" placeholder="Admin JWT token" />
        <button class="btn btn-primary" id="saveTokenBtn">Save Token</button>
      </div>
    </div>

    <div id="screens"></div>

    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <h3 id="modalTitle">Edit</h3>
        <div id="modalBody"></div>
        <div class="modal-actions">
          <button class="btn" id="modalCancel">Cancel</button>
          <button class="btn btn-primary" id="modalSave">Save</button>
        </div>
      </div>
    </div>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
