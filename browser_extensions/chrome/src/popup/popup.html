<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TigerWallet</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🐯</span>
        <span class="logo-text">TigerWallet</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="settings-btn" title="Settings">⚙️</button>
        <button class="icon-btn theme-btn" id="theme-btn" title="Toggle Theme">🌙</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Connected State -->
      <div id="connected-view" class="view">
        <div class="balance-card">
          <div class="balance-label">Total Balance</div>
          <div class="balance-value" id="total-balance">$0.00</div>
          <div class="balance-change" id="balance-change">↑ $0.00 (0%)</div>
        </div>

        <div class="network-selector">
          <button class="network-btn" id="network-btn">
            <span class="network-icon">🔷</span>
            <span class="network-name" id="current-network">Ethereum</span>
            <span class="dropdown">▼</span>
          </button>
        </div>

        <div class="account-card">
          <div class="account-label">Account</div>
          <div class="account-address" id="account-address">0x0000...0000</div>
          <div class="account-actions">
            <button class="action-btn" id="copy-btn">📋 Copy</button>
            <button class="action-btn" id="qr-btn">📱 QR</button>
          </div>
        </div>

        <div class="actions-grid">
          <button class="action-card" id="send-btn">
            <span class="action-icon">↑</span>
            <span class="action-label">Send</span>
          </button>
          <button class="action-card" id="receive-btn">
            <span class="action-icon">↓</span>
            <span class="action-label">Receive</span>
          </button>
          <button class="action-card" id="swap-btn">
            <span class="action-icon">⇄</span>
            <span class="action-label">Swap</span>
          </button>
          <button class="action-card" id="bridge-btn">
            <span class="action-icon">🌉</span>
            <span class="action-label">Bridge</span>
          </button>
        </div>

        <div class="tokens-section">
          <div class="section-header">
            <span class="section-title">Assets</span>
            <button class="add-btn" id="add-token-btn">+ Add</button>
          </div>
          <div class="tokens-list" id="tokens-list">
            <!-- Token items will be added here -->
          </div>
        </div>
      </div>

      <!-- Disconnected State -->
      <div id="disconnected-view" class="view hidden">
        <div class="welcome-card">
          <div class="welcome-icon">🐯</div>
          <h2 class="welcome-title">Welcome to TigerWallet</h2>
          <p class="welcome-text">The secure multi-chain wallet for DeFi</p>
        </div>
        
        <div class="auth-buttons">
          <button class="primary-btn" id="create-wallet-btn">
            <span class="btn-icon">✨</span>
            Create New Wallet
          </button>
          <button class="secondary-btn" id="import-wallet-btn">
            <span class="btn-icon">📥</span>
            Import Wallet
          </button>
        </div>

        <div class="features">
          <div class="feature">
            <span class="feature-icon">🔒</span>
            <span class="feature-text">Bank-level Security</span>
          </div>
          <div class="feature">
            <span class="feature-icon">🌐</span>
            <span class="feature-text">100+ Chains</span>
          </div>
          <div class="feature">
            <span class="feature-icon">⚡</span>
            <span class="feature-text">Lightning Fast</span>
          </div>
        </div>
      </div>

      <!-- Locked State -->
      <div id="locked-view" class="view hidden">
        <div class="lock-card">
          <div class="lock-icon">🔐</div>
          <h2 class="lock-title">Wallet Locked</h2>
          <p class="lock-text">Enter your password to unlock</p>
        </div>
        
        <div class="unlock-form">
          <input type="password" class="input" id="password-input" placeholder="Password">
          <button class="primary-btn" id="unlock-btn">Unlock</button>
        </div>

        <button class="link-btn" id="forgot-password-btn">Forgot Password?</button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <button class="footer-btn" id="history-btn">
        <span class="footer-icon">📜</span>
        <span class="footer-label">History</span>
      </button>
      <button class="footer-btn" id="dapps-btn">
        <span class="footer-icon">🌐</span>
        <span class="footer-label">DApps</span>
      </button>
      <button class="footer-btn" id="settings-footer-btn">
        <span class="footer-icon">⚙️</span>
        <span class="footer-label">Settings</span>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
