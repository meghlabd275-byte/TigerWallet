[package]
name = "tigerwallet-security"
version = "1.0.0"
edition = "2021"
description = "TigerWallet Security Module - Hardware Wallet, Privacy, Risk Analysis"
authors = ["TigerWallet"]

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
hex = "0.4"
getrandom = "0.2"
# Real secp256k1 (EVM) and Ed25519 signature verification.
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha3 = "0.10"
# PBKDF2-HMAC-SHA256 password-based key derivation. Pinned to the 0.12 line,
# which builds on sha2 0.10 and keeps the MSRV at 1.85.
pbkdf2 = { version = "0.12", features = ["simple"] }


[features]
default = ["wasm"]
wasm = []

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true