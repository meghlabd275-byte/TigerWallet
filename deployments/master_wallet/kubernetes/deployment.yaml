# MasterWallet Kubernetes Deployment
# Deploy on any Kubernetes cluster (EKS, GKE, AKS, on-premise)

---
apiVersion: v1
kind: Namespace
metadata:
  name: master-wallet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: master-wallet-config
  namespace: master-wallet
data:
  DATABASE_HOST: "postgres.master-wallet.svc.cluster.local"
  DATABASE_PORT: "5432"
  REDIS_HOST: "redis.master-wallet.svc.cluster.local"
  REDIS_PORT: "6379"
  SUPER_ADMIN_URL: "https://super-admin.tigerwallet.com"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: master-wallet-secrets
  namespace: master-wallet
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME"
  API_KEY: "CHANGE_ME"
  API_SECRET: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: master-wallet
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: master-wallet
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "masterwallet"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: master-wallet-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: "masterwallet"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: master-wallet
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: master-wallet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb"]
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: master-wallet-backend
  namespace: master-wallet
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app: master-wallet-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: master-wallet-backend
  namespace: master-wallet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: master-wallet-backend
  template:
    metadata:
      labels:
        app: master-wallet-backend
    spec:
      containers:
        - name: backend
          image: tigerwallet/master-wallet-backend:latest
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: master-wallet-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: master-wallet-config
                  key: DATABASE_PORT
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: master-wallet-config
                  key: REDIS_HOST
            - name: SUPER_ADMIN_URL
              valueFrom:
                configMapKeyRef:
                  name: master-wallet-config
                  key: SUPER_ADMIN_URL
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: master-wallet-secrets
                  key: API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: master-wallet-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: master-wallet-frontend
  namespace: master-wallet
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: master-wallet-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: master-wallet-frontend
  namespace: master-wallet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: master-wallet-frontend
  template:
    metadata:
      labels:
        app: master-wallet-frontend
    spec:
      containers:
        - name: frontend
          image: tigerwallet/master-wallet-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: master-wallet-backend-hpa
  namespace: master-wallet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: master-wallet-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: master-wallet-ingress
  namespace: master-wallet
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - masterwallet.yourdomain.com
      secretName: master-wallet-tls
  rules:
    - host: masterwallet.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: master-wallet-backend
                port:
                  number: 8001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: master-wallet-frontend
                port:
                  number: 80
