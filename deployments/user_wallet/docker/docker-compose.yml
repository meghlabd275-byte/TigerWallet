# UserWallet Standalone Deployment

version: '3.8'

services:
  # UserWallet Backend (canonical wallet_api on :8443)
  user-wallet-backend:
    build:
      context: ../../..
      dockerfile: deployments/docker/Dockerfile.go-backend
      args:
        TARGET_MODULE: go/wallet_api
    container_name: ${TENANT_SLUG}-user-wallet-backend
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379
      - SUPER_ADMIN_URL=${SUPER_ADMIN_URL}
      - TENANT_ID=${TENANT_ID}
      - TENANT_SLUG=${TENANT_SLUG}
      - API_KEY=${API_KEY}
      - API_SECRET=${API_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - KYC_ENABLED=true
    ports:
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - user-wallet-network
    restart: unless-stopped

  # UserWallet Frontend (CRA; built at repo-root user_wallet/web)
  user-wallet-frontend:
    build:
      context: ../../../user_wallet/web
      dockerfile: Dockerfile
      args:
        # CRA inlines REACT_APP_* at build time (runtime env has no effect).
        # Relative path: the browser talks to nginx, which proxies /api/ to the
        # backend. A container hostname would be unresolvable from the browser.
        REACT_APP_API_URL: /api/v1
        REACT_APP_WS_URL: /ws
        REACT_APP_TENANT_SLUG: ${TENANT_SLUG}
    container_name: ${TENANT_SLUG}-user-wallet-frontend
    environment:
      - REACT_APP_API_URL=/api/v1
      - REACT_APP_WS_URL=/ws
      - REACT_APP_TENANT_SLUG=${TENANT_SLUG}
    ports:
      - "3002:80"
    depends_on:
      - user-wallet-backend
    networks:
      - user-wallet-network
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: ${TENANT_SLUG}-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - user-wallet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ${TENANT_SLUG}-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - user-wallet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - user-wallet-backend
      - user-wallet-frontend
    networks:
      - user-wallet-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  user-wallet-network:
    driver: bridge
