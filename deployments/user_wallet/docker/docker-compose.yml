# UserWallet Standalone Deployment

version: '3.8'

services:
  # UserWallet Backend (canonical wallet_api on :8443)
  user-wallet-backend:
    build:
      context: ../../../go/wallet_api
      dockerfile: Dockerfile
    container_name: ${TENANT_SLUG}-user-wallet-backend
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379
      - SUPER_ADMIN_URL=${SUPER_ADMIN_URL}
      - TENANT_ID=${TENANT_ID}
      - TENANT_SLUG=${TENANT_SLUG}
      - API_KEY=${API_KEY}
      - API_SECRET=${API_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - KYC_ENABLED=true
    ports:
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - user-wallet-network
    restart: unless-stopped

  # UserWallet Frontend
  user-wallet-frontend:
    build:
      context: ../../user_wallet/web
      dockerfile: Dockerfile
    container_name: ${TENANT_SLUG}-user-wallet-frontend
    environment:
      - REACT_APP_API_URL=http://user-wallet-backend:8443
      - REACT_APP_WS_URL=ws://user-wallet-backend:8443
      - REACT_APP_TENANT_SLUG=${TENANT_SLUG}
    ports:
      - "3002:80"
    depends_on:
      - user-wallet-backend
    networks:
      - user-wallet-network
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: ${TENANT_SLUG}-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - user-wallet-network
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ${TENANT_SLUG}-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - user-wallet-network
    restart: unless-stopped

  # Nginx
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - user-wallet-backend
      - user-wallet-frontend
    networks:
      - user-wallet-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  user-wallet-network:
    driver: bridge
