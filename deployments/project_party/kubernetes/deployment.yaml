# ProjectParty Kubernetes Deployment
---
apiVersion: v1
kind: Namespace
metadata:
  name: project-party
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: project-party-config
  namespace: project-party
data:
  DATABASE_HOST: "postgres.project-party.svc.cluster.local"
  REDIS_HOST: "redis.project-party.svc.cluster.local"
  SUPER_ADMIN_URL: "https://super-admin.tigerwallet.com"
  LISTING_FEE_USD: "500"
---
apiVersion: v1
kind: Secret
metadata:
  name: project-party-secrets
  namespace: project-party
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME"
  API_KEY: "CHANGE_ME"
  API_SECRET: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: project-party
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: project-party
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "projectparty"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project-party-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: "projectparty"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: project-party
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: project-party
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: project-party-backend
  namespace: project-party
spec:
  type: ClusterIP
  ports:
    - port: 8004
      targetPort: 8004
  selector:
    app: project-party-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-party-backend
  namespace: project-party
spec:
  replicas: 3
  selector:
    matchLabels:
      app: project-party-backend
  template:
    metadata:
      labels:
        app: project-party-backend
    spec:
      containers:
        - name: backend
          image: tigerwallet/project-party-backend:latest
          ports:
            - containerPort: 8004
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: project-party-config
                  key: DATABASE_HOST
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: project-party-secrets
                  key: API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: project-party-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: project-party-frontend
  namespace: project-party
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: project-party-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-party-frontend
  namespace: project-party
spec:
  replicas: 3
  selector:
    matchLabels:
      app: project-party-frontend
  template:
    metadata:
      labels:
        app: project-party-frontend
    spec:
      containers:
        - name: frontend
          image: tigerwallet/project-party-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: project-party-backend-hpa
  namespace: project-party
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: project-party-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: project-party-ingress
  namespace: project-party
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - projectparty.yourdomain.com
      secretName: project-party-tls
  rules:
    - host: projectparty.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: project-party-backend
                port:
                  number: 8004
          - path: /
            pathType: Prefix
            backend:
              service:
                name: project-party-frontend
                port:
                  number: 80
