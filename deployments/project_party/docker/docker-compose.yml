# ProjectParty Token Listing Platform Standalone Deployment

version: '3.8'

services:
  # ProjectParty Backend
  project-party-backend:
    build:
      context: ../../project_party/go
      dockerfile: Dockerfile
    container_name: ${TENANT_SLUG}-project-party-backend
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379
      - SUPER_ADMIN_URL=${SUPER_ADMIN_URL}
      - TENANT_ID=${TENANT_ID}
      - TENANT_SLUG=${TENANT_SLUG}
      - API_KEY=${API_KEY}
      - API_SECRET=${API_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - LISTING_FEE_USD=500
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - project-party-network
    restart: unless-stopped

  # ProjectParty Frontend
  project-party-frontend:
    build:
      context: ../../project_party/web
      dockerfile: Dockerfile
    container_name: ${TENANT_SLUG}-project-party-frontend
    environment:
      - REACT_APP_API_URL=http://project-party-backend:8004
      - REACT_APP_WS_URL=ws://project-party-backend:8004
    ports:
      - "3004:80"
    depends_on:
      - project-party-backend
    networks:
      - project-party-network
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - project-party-network
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - project-party-network
    restart: unless-stopped

  # Nginx
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - project-party-backend
      - project-party-frontend
    networks:
      - project-party-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  project-party-network:
    driver: bridge
