# Bots Platform Kubernetes Deployment
---
apiVersion: v1
kind: Namespace
metadata:
  name: bots
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bots-config
  namespace: bots
data:
  DATABASE_HOST: "postgres.bots.svc.cluster.local"
  REDIS_HOST: "redis.bots.svc.cluster.local"
  SUPER_ADMIN_URL: "https://super-admin.tigerwallet.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: bots-secrets
  namespace: bots
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME"
  API_KEY: "CHANGE_ME"
  API_SECRET: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bots
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bots
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "bots"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bots-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: "bots"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: bots
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: bots
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1g"]
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: bots-backend
  namespace: bots
spec:
  type: ClusterIP
  ports:
    - port: 8003
      targetPort: 8003
  selector:
    app: bots-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bots-backend
  namespace: bots
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bots-backend
  template:
    metadata:
      labels:
        app: bots-backend
    spec:
      containers:
        - name: backend
          image: tigerwallet/bots-backend:latest
          ports:
            - containerPort: 8003
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: bots-config
                  key: DATABASE_HOST
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: bots-secrets
                  key: API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bots-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: bots-frontend
  namespace: bots
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: bots-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bots-frontend
  namespace: bots
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bots-frontend
  template:
    metadata:
      labels:
        app: bots-frontend
    spec:
      containers:
        - name: frontend
          image: tigerwallet/bots-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bots-backend-hpa
  namespace: bots
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bots-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bots-ingress
  namespace: bots
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - bots.yourdomain.com
      secretName: bots-tls
  rules:
    - host: bots.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: bots-backend
                port:
                  number: 8003
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bots-frontend
                port:
                  number: 80
