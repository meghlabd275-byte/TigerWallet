# TigerWallet Production Docker Compose
# Multi-service deployment with all backend services

version: '3.8'

services:
  # ============================================
  # CORE SERVICES
  # ============================================

  # API Gateway
  api-gateway:
    build:
      context: ./go/api_gateway
      dockerfile: Dockerfile
    container_name: tigerwallet-api-gateway
    ports:
      - "8080:8080"
    environment:
      # The gateway binds PORT; keep it in step with the published mapping.
      - PORT=8080
      - NODE_ENV=production
      # The gateway refuses to start without a signing secret of at least 32
      # characters. It reads GATEWAY_JWT_SECRET; point that at the platform
      # secret so one configured value covers the stack. Override it here if
      # you want the gateway to sign with a dedicated key.
      - GATEWAY_JWT_SECRET=${JWT_SECRET}
      # Token guarding the gateway's own /admin/* routes. Generate one with
      # `openssl rand -base64 48`.
      - GATEWAY_ADMIN_TOKEN=${GATEWAY_ADMIN_TOKEN:-}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=tigerwallet
    depends_on:
      - redis
      - postgres
    networks:
      - tigerwallet
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Canonical wallet backend (Go). Real BIP-39/32/44 HD derivation, secp256k1
  # signing, EVM broadcast and on-chain fetchers, PostgreSQL persistence. The
  # wallet-service below is a thin reverse proxy onto this process, so the stack
  # is not functional without it.
  wallet-api:
    build:
      context: ./go/wallet_api
      dockerfile: Dockerfile
    container_name: tigerwallet-wallet-api
    ports:
      - "8443:8443"
    environment:
      - WALLET_API_PORT=8443
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/tigerwallet?sslmode=disable
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY:-}
      - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}
      # TigerSmartChain is the platform's own network. TGR is its native coin and
      # RUSD/WTGR are genesis predeploys, so balances, sends and swaps for them
      # need this endpoint.
      - TSC_RPC_URL=http://tsc-node:8545
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      tsc-node:
        condition: service_healthy
    networks:
      - tigerwallet
    restart: unless-stopped

  # Listing Service
  listing-service:
    build:
      context: ./listing_service/go
      dockerfile: Dockerfile
    container_name: tigerwallet-listing-service
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=tigerwallet_listing
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - tigerwallet
    restart: unless-stopped

  # CEX Connector Service
  cex-connector:
    build:
      context: ./go/cex_connector
      dockerfile: Dockerfile
    container_name: tigerwallet-cex-connector
    ports:
      - "8090:8090"
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - COINBASE_API_KEY=${COINBASE_API_KEY}
      - COINBASE_API_SECRET=${COINBASE_API_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - tigerwallet
    restart: unless-stopped

  # WebSocket Service
  websocket-service:
    build:
      context: ./go/websocket_service
      dockerfile: Dockerfile
    container_name: tigerwallet-websocket
    ports:
      - "8095:8095"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - tigerwallet
    restart: unless-stopped

  # ============================================
  # WALLET SERVICES
  # ============================================

  wallet-service:
    build:
      context: ./go/wallet_service
      dockerfile: Dockerfile
    container_name: tigerwallet-wallet-service
    ports:
      - "8082:8001"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=tigerwallet_wallet
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # This service is a reverse proxy to the canonical wallet backend; without
      # the target it would forward to localhost inside its own container, where
      # nothing listens.
      - WALLET_API_URL=http://wallet-api:8443
    depends_on:
      - postgres
      - redis
      - wallet-api
    networks:
      - tigerwallet
    restart: unless-stopped

  swap-service:
    build:
      context: ./go/swap_service
      dockerfile: Dockerfile
    container_name: tigerwallet-swap-service
    ports:
      - "8083:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=tigerwallet_swap
    depends_on:
      - postgres
    networks:
      - tigerwallet
    restart: unless-stopped

  # ============================================
  # TRADING & BOTS
  # ============================================

  bot-api:
    build:
      context: ./mm_bot_platform/bot_api
      dockerfile: Dockerfile
    container_name: tigerwallet-bot-api
    ports:
      - "8091:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=tigerwallet_bots
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    networks:
      - tigerwallet
    restart: unless-stopped

  # ============================================
  # NFT & COLLECTIBLES
  # ============================================

  nft-service:
    build:
      context: ./go/nft_service
      dockerfile: Dockerfile
    container_name: tigerwallet-nft-service
    ports:
      - "8085:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=tigerwallet_nft
      - IPFS_HOST=ipfs
      - IPFS_PORT=5001
    depends_on:
      - postgres
      - ipfs
    networks:
      - tigerwallet
    restart: unless-stopped

  # ============================================
  # INFRASTRUCTURE
  # ============================================

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tigerwallet-postgres
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      # The database the image itself creates. The other per-service databases
      # are created by the init script below: the image ignores any
      # multi-database variable, so without that script every service whose
      # DB_NAME differs from this one cannot connect.
      - POSTGRES_DB=tigerwallet
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d tigerwallet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tigerwallet
    restart: unless-stopped
    command: postgres -c max_connections=200 -c shared_buffers=256MB

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tigerwallet-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - tigerwallet
    restart: unless-stopped

  # IPFS for NFT Metadata
  ipfs:
    image: ipfs/kubo:latest
    container_name: tigerwallet-ipfs
    volumes:
      - ipfs_data:/data/ipfs
    ports:
      - "5001:5001"
      - "8080:8080"
    networks:
      - tigerwallet
    restart: unless-stopped

  # ============================================
  # MONITORING
  # ============================================

  prometheus:
    image: prom/prometheus:latest
    container_name: tigerwallet-prometheus
    volumes:
      - ./deployments/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - tigerwallet
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: tigerwallet-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    networks:
      - tigerwallet
    restart: unless-stopped

  # ============================================
  # MESSAGE QUEUE
  # ============================================

  nats:
    image: nats:latest
    container_name: tigerwallet-nats
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    networks:
      - tigerwallet
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: tigerwallet-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    networks:
      - tigerwallet
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: tigerwallet-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - tigerwallet
    restart: unless-stopped

  # ============================================
  # BLOCKCHAIN NODES
  # ============================================

  # TigerSmartChain - the platform's own EVM network. TGR is the native coin;
  # RUSD and WTGR are genesis predeploys. The wallet backend reads this node
  # through TSC_RPC_URL.
  tsc-node:
    build:
      context: ./tiger_smart_chain
      dockerfile: Dockerfile
    container_name: tigerwallet-tsc-node
    ports:
      - "8555:8545"
      - "8556:8546"
    volumes:
      - tsc_data:/data
    environment:
      # Fixes the genesis block, so every node on the network derives an
      # identical chain. Changing it on a running network forks it.
      - TSC_GENESIS_SEED=${TSC_GENESIS_SEED:?TSC_GENESIS_SEED must be set - it determines the genesis block every node must agree on}
      - TSC_CHAIN_ID=7710
      - TSC_VALIDATORS=${TSC_VALIDATORS:-1}
      - TSC_VALIDATOR_KEY=${TSC_VALIDATOR_KEY:-}
      - TSC_MINE=${TSC_MINE:-true}
    healthcheck:
      # A JSON-RPC probe, so health reflects whether the node can answer clients
      # rather than merely whether the process is running.
      test:
        - CMD-SHELL
        - >-
          curl -fsS -X POST -H 'Content-Type: application/json'
          --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
          http://127.0.0.1:8545 | grep -q '0x1e1e'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - tigerwallet
    restart: unless-stopped

  ethereum-node:
    image: ethereum/client-go:latest
    container_name: tigerwallet-ethereum-node
    command: --syncmode=light --http --http.addr=0.0.0.0 --http.port=8545 --http.api=eth,net,web3 --ws --ws.addr=0.0.0.0 --ws.port=8546 --ws.api=eth,net,web3
    ports:
      - "8545:8545"
      - "8546:8546"
    networks:
      - tigerwallet
    restart: unless-stopped

  bsc-node:
    image: bsc/client-go:latest
    container_name: tigerwallet-bsc-node
    command: --syncmode=light --http --http.addr=0.0.0.0 --http.port=8547 --http.api=eth,net,web3 --ws --ws.addr=0.0.0.0 --ws.port=8548 --ws.api=eth,net,web3
    ports:
      - "8547:8547"
      - "8548:8548"
    networks:
      - tigerwallet
    restart: unless-stopped

  polygon-node:
    image: maticnetwork/bor:latest
    container_name: tigrwallet-polygon-node
    command: --config /etc/bor/config.toml
    ports:
      - "8549:8549"
    networks:
      - tigerwallet
    restart: unless-stopped

networks:
  tigerwallet:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ipfs_data:
  tsc_data:
  prometheus_data:
  grafana_data:
