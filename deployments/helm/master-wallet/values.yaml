# Default values for TigerWallet

global:
  imageRegistry: docker.io
  imagePullSecrets: []
  storageClass: ""

# Backend Configuration
backend:
  replicaCount: 3
  image:
    repository: tigerwallet/master-wallet-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8001
    annotations: {}
  ingress:
    enabled: true
    className: nginx
    hostname: masterwallet.yourdomain.com
    tls: true
    secretName: tigerwallet-tls
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: tigerwallet-secrets
          key: database-url
    - name: REDIS_URL
      value: "redis://redis:6379"
    - name: SUPER_ADMIN_URL
      value: "https://super-admin.tigerwallet.com"
    - name: API_KEY
      valueFrom:
        secretKeyRef:
          name: tigerwallet-secrets
          key: api-key
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: tigerwallet-secrets
          key: jwt-secret
  livenessProbe:
    httpGet:
      path: /health
      port: 8001
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /health
      port: 8001
    initialDelaySeconds: 5
    periodSeconds: 10

# Frontend Configuration
frontend:
  replicaCount: 3
  image:
    repository: tigerwallet/master-wallet-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: nginx
    hostname: masterwallet.yourdomain.com
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  env:
    - name: REACT_APP_API_URL
      value: "https://api.masterwallet.yourdomain.com"
    - name: REACT_APP_WS_URL
      value: "wss://api.masterwallet.yourdomain.com"

# PostgreSQL Configuration
postgresql:
  enabled: true
  auth:
    username: tigerwallet
    password: changeme
    database: tigerwallet
  primary:
    persistence:
      size: 20Gi
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi

# Redis Configuration
redis:
  enabled: true
  auth:
    enabled: true
    password: changeme
  architecture: standalone
  master:
    persistence:
      size: 8Gi
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi

# Nginx Ingress
nginx-ingress-controller:
  enabled: true
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
