apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tigerwallet.fullname" . }}
  labels:
    {{- include "tigerwallet.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tigerwallet.fullname" . }}-config
  labels:
    {{- include "tigerwallet.labels" . | nindent 4 }}
data:
  SUPER_ADMIN_URL: {{ .Values.backend.env.SUPER_ADMIN_URL | default "https://super-admin.tigerwallet.com" | quote }}
  REDIS_URL: {{ .Values.backend.env.REDIS_URL | default "redis://redis:6379" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tigerwallet.fullname" . }}-secrets
  labels:
    {{- include "tigerwallet.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.global.databaseUrl | default "" | quote }}
  api-key: {{ .Values.global.apiKey | default "" | quote }}
  jwt-secret: {{ .Values.global.jwtSecret | default "" | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tigerwallet.fullname" . }}-backend
  labels:
    {{- include "tigerwallet.labels" . | nindent 4 }}
    component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tigerwallet.selectorLabels" . | nindent 4 }}
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tigerwallet.fullname" . }}-frontend
  labels:
    {{- include "tigerwallet.labels" . | nindent 4 }}
    component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tigerwallet.selectorLabels" . | nindent 4 }}
    component: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tigerwallet.fullname" . }}-backend
  labels:
    {{- include "tigerwallet.labels" . | nindent 4 }}
    component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "tigerwallet.selectorLabels" . | nindent 6 }}
      component: backend
  template:
    metadata:
      labels:
        {{- include "tigerwallet.selectorLabels" . | nindent 8 }}
        component: backend
    spec:
      serviceAccountName: {{ include "tigerwallet.fullname" . }}
      containers:
        - name: backend
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          env:
            {{- toYaml .Values.backend.env | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "tigerwallet.fullname" . }}-config
            - secretRef:
                name: {{ include "tigerwallet.fullname" . }}-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tigerwallet.fullname" . }}-frontend
  labels:
    {{- include "tigerwallet.labels" . | nindent 4 }}
    component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "tigerwallet.selectorLabels" . | nindent 6 }}
      component: frontend
  template:
    metadata:
      labels:
        {{- include "tigerwallet.selectorLabels" . | nindent 8 }}
        component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          env:
            {{- toYaml .Values.frontend.env | nindent 12 }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "tigerwallet.fullname" . }}-backend-hpa
  labels:
    {{- include "tigerwallet.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "tigerwallet.fullname" . }}-backend
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
---
{{- if .Values.backend.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tigerwallet.fullname" . }}-ingress
  labels:
    {{- include "tigerwallet.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.backend.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.backend.ingress.className }}
  {{- if .Values.backend.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.backend.ingress.hostname | quote }}
      secretName: {{ .Values.backend.ingress.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.backend.ingress.hostname | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "tigerwallet.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "tigerwallet.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
