# TigerWallet Helm Chart

apiVersion: v2
name: tigerwallet
description: A Helm chart for TigerWallet white label products
type: application
version: 1.0.0
appVersion: "1.0.0"

maintainers:
  - name: TigerWallet
    email: support@tigerwallet.com

keywords:
  - wallet
  - blockchain
  - cryptocurrency
  - fintech

dependencies:
  - name: postgresql
    version: 12.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 17.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: nginx-ingress-controller
    version: 9.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: nginx-ingress-controller.enabled
