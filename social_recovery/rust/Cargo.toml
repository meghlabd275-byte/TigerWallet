[package]
name = "tiger-social-recovery"
version = "1.0.0"
edition = "2021"
description = "TigerWallet Social Recovery - Distributed Key Recovery"
authors = ["TigerWallet Team"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4"] }
base64 = "0.21"
tracing = "0.1"

[lib]
name = "social_recovery"
path = "src/lib.rs"
