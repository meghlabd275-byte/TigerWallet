[package]
name = "tiger-wallet-desktop"
version = "1.0.0"
description = "TigerWallet Desktop Application - Enterprise-grade multi-chain cryptocurrency wallet"
authors = ["TigerWallet Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
    "shell-open", 
    "window-all", 
    "dialog-all", 
    "notification-all", 
    "global-shortcut-all",
    "clipboard-all",
    "fs-all",
    "path-all",
    "os-all",
    "process-all",
    "http-all",
    "crypto-all",
    "storage-all"
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Logging
log = "0.4"
env_logger = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.0", features = ["v4", "serde", "v5"] }

# Cryptography
base64 = "0.21"
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
thiserror = "1.0"
ed25519-dalek = { version = "2.0", features = ["serde"] }
secp256k1 = { version = "0.27", features = ["recovery", "serde"] }

# BIP39/BIP32
bip39 = "0.2"
bip32 = "0.4"

# Hardware wallet support
usb = { version = "1.8", features = ["serde"] }
hidapi = "1.4"

# Windows-specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Console"
]}

# macOS-specific
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
