<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TigerWallet Super Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #0f172a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1e293b; color: #f1f5f9; }
    }
    .header {
      padding: 16px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      text-align: center;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header p { font-size: 11px; opacity: 0.9; margin-top: 4px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
    .stat {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      .stat { background: #334155; }
    }
    .stat-value { font-size: 18px; font-weight: 700; }
    .stat-label { font-size: 10px; color: #64748b; margin-top: 4px; }
    .nav { padding: 8px; border-top: 1px solid #e2e8f0; }
    @media (prefers-color-scheme: dark) { .nav { border-color: #334155; } }
    .nav-item {
      display: block;
      padding: 10px 12px;
      color: #475569;
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
      transition: background 0.2s;
    }
    @media (prefers-color-scheme: dark) { .nav-item { color: #94a3b8; } }
    .nav-item:hover { background: #f1f5f9; }
    @media (prefers-color-scheme: dark) { .nav-item:hover { background: #334155; } }
    .theme-toggle {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: #475569;
      margin-top: 8px;
    }
    @media (prefers-color-scheme: dark) {
      .theme-toggle { border-color: #334155; color: #94a3b8; }
    }
    .loading { padding: 40px; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🐯 TigerWallet</h1>
    <p>Super Admin Portal</p>
  </div>
  
  <div class="stats" id="stats">
    <div class="loading">Loading...</div>
  </div>
  
  <div class="nav">
    <a href="#" class="nav-item" data-page="dashboard">📊 Dashboard</a>
    <a href="#" class="nav-item" data-page="users">👥 Users</a>
    <a href="#" class="nav-item" data-page="transactions">💸 Transactions</a>
    <a href="#" class="nav-item" data-page="withdrawals">💰 Withdrawals</a>
    <a href="#" class="nav-item" data-page="whitelabels">🏢 White Labels</a>
    <a href="#" class="nav-item" data-page="tickets">🎫 Tickets</a>
    <button class="theme-toggle" id="themeToggle">🌓 Toggle Theme</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
