[package]
name = "institutional_custody"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
thiserror = "1.0"
ring = "0.17"
sha3 = "0.10"
hex = "0.4"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4.38", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
