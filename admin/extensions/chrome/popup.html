<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TigerAdmin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }
    .header {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      padding: 20px;
      text-align: center;
    }
    .header h1 { font-size: 20px; margin-bottom: 5px; }
    .header p { font-size: 12px; opacity: 0.8; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 15px;
    }
    .stat-card {
      background: #2d2d2d;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-value { font-size: 18px; font-weight: bold; }
    .stat-label { font-size: 10px; color: #888; margin-top: 5px; }
    .section { padding: 15px; border-top: 1px solid #333; }
    .section h2 { font-size: 14px; margin-bottom: 10px; }
    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #2d2d2d;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .user-email { font-weight: bold; font-size: 12px; }
    .user-status { font-size: 10px; color: #4caf50; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #dc2626;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover { background: #b91c1c; }
    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #2d2d2d;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .toggle {
      width: 40px;
      height: 20px;
      background: #444;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
    }
    .toggle.active { background: #dc2626; }
    .toggle::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.2s;
    }
    .toggle.active::after { transform: translateX(20px); }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔧 TigerAdmin</h1>
    <p>Platform Administration</p>
  </div>
  
  <div class="stats">
    <div class="stat-card">
      <div class="stat-value">12,450</div>
      <div class="stat-label">Total Users</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">$45.2M</div>
      <div class="stat-label">Total Volume</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">89</div>
      <div class="stat-label">Pending KYC</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">99.9%</div>
      <div class="stat-label">System Health</div>
    </div>
  </div>
  
  <div class="section">
    <h2>Recent Users</h2>
    <div class="user-item">
      <div>
        <div class="user-email">user1@example.com</div>
        <div class="user-status">✓ Verified</div>
      </div>
      <span>→</span>
    </div>
    <div class="user-item">
      <div>
        <div class="user-email">user2@example.com</div>
        <div class="user-status" style="color: #ff9800;">⏳ Pending</div>
      </div>
      <span>→</span>
    </div>
    <div class="user-item">
      <div>
        <div class="user-email">user3@example.com</div>
        <div class="user-status">✓ Verified</div>
      </div>
      <span>→</span>
    </div>
    <button class="btn" id="viewAll">View All Users</button>
  </div>
  
  <div class="section">
    <h2>Quick Actions</h2>
    <button class="btn" style="background: #4caf50;">📜 View Transactions</button>
    <button class="btn" style="background: #ff9800;">⚙️ System Config</button>
    <button class="btn" style="background: #9c27b0;">📊 Analytics</button>
  </div>
  
  <div class="section">
    <h2>Settings</h2>
    <div class="settings-row">
      <span>Dark Mode</span>
      <div class="toggle active" id="themeToggle"></div>
    </div>
    <div class="settings-row">
      <span>Auto-Approve KYC</span>
      <div class="toggle" id="autoApprove"></div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
