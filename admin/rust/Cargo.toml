[package]
name = "tiger-admin-rust"
version = "1.0.0"
edition = "2021"
description = "TigerWallet Admin Rust Backend - High Performance"

[dependencies]
# Web server
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "add-extension"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Authentication
jsonwebtoken = "9"
bcrypt = "0.15"
argon2 = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Async
futures = "0.3"

# Validation
validator = { version = "0.16", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "tiger_admin"
path = "src/lib.rs"

[[bin]]
name = "tiger-admin"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
