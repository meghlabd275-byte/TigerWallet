[package]
name = "white_label_templates"
version = "1.0.0"
edition = "2021"
description = "TigerWallet White Label Templates - High-speed template management"

[dependencies]
actix-web = "4.4"
actix-rt = "2.9"
tokio = { version = "1.33", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "runtime-actix-native-tls", "uuid", "chrono"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "1.0"
async-trait = "0.1"
base64 = "0.21"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
image = "0.24"
resvg = "0.36"
tiny-skia = "0.11"

[features]
default = ["postgres"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
