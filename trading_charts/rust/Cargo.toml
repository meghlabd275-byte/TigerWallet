[package]
name = "trading_charts"
version = "1.0.0"
edition = "2021"
description = "TigerWallet Advanced Trading Charts"

[dependencies]
actix-web = "4.4"
tokio = { version = "1.33", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"

[features]
default = []

[profile.release]
opt-level = 3
lto = true
