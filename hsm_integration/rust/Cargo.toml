[package]
name = "tigerwallet-hsm"
version = "1.0.0"
edition = "2021"
description = "TigerWallet HSM Integration Service"

[dependencies]
# Crypto
aes-gcm = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "std"] }
ed25519-dalek = { version = "2.0", features = ["rand_core", "pkcs8"] }
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
ring = "0.17"
elliptic-curve = "0.13"
p256 = { version = "0.13", features = ["ecdsa", "std"] }
log = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Errors
thiserror = "1.0"

# Logging
env_logger = "0.11"

# Base64
base64 = "0.21"

# Random
rand = "0.8"

[lib]
name = "hsm_integration"
path = "src/main.rs"
