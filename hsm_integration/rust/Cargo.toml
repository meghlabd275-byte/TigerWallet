[package]
name = "tigerwallet-hsm"
version = "1.0.0"
edition = "2021"
description = "TigerWallet HSM Integration Service"

[dependencies]
# Crypto
aes-gcm = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "std"] }
ed25519-dalek = "2.0"
rsa = "0.9"
sha2 = "0.10"
ring = "0.17"
cryptography = "0.4"
elliptic-curve = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Errors
thiserror = "1.0"

# Logging
env_logger = "0.11"

# Base64
base64 = "0.21"

# Random
rand = "0.8"

[lib]
name = "hsm_integration"
path = "src/main.rs"
