[package]
name = "tiger-master-wallet"
version = "1.0.0"
edition = "2021"
description = "TigerWallet MasterWallet - Ultra-low latency Rust core (real secp256k1/keccak/BIP-39/32/44)"
authors = ["TigerWallet Team"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client to the canonical Go backend (:8450)
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography — REAL secp256k1 (EVM), keccak256, AES-256-GCM, scrypt
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
sha2 = { version = "0.10", features = ["oid"] }
sha3 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
rand = "0.8"
hex = "0.4"
base64 = "0.21"
subtle = "2.5"

# Logging
tracing = "0.1"

# Utilities
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
once_cell = "1.19"
parking_lot = "0.12"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "tiger_master_wallet"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
