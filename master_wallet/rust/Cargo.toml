[package]
name = "tiger-master-wallet"
version = "1.0.0"
edition = "2021"
description = "TigerWallet MasterWallet - Ultra-low latency Rust implementation"
authors = ["TigerWallet Team"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "scripting", "pub-sub"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "rustls", "migrations", "uuid", "chrono"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.21"
hex = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Utilities
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
once_cell = "1.19"
parking_lot = "0.12"

# Performance
lru = "0.12"
dashmap = "5.5"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[lib]
name = "tiger_master_wallet"
path = "src/lib.rs"

[[bin]]
name = "master-wallet-service"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
