<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>TigerMasterWallet</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --bg-card: #2d2d2d;
      --bg-elev: #333;
      --text: #fff;
      --text-muted: #888;
      --accent: #667eea;
      --accent-hover: #5a6fd6;
      --success: #4caf50;
      --danger: #e91e63;
      --border: #333;
    }
    [data-theme="light"] {
      --bg: #f7f7fa;
      --bg-card: #ffffff;
      --bg-elev: #eef0f4;
      --text: #1a1a1a;
      --text-muted: #666;
      --accent: #5a6fd6;
      --accent-hover: #4a5fc6;
      --success: #2e7d32;
      --danger: #c2185b;
      --border: #e0e0e0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      min-height: 420px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 16px;
      text-align: center;
    }
    .header h1 { font-size: 18px; margin-bottom: 4px; color: #fff; }
    .header p { font-size: 11px; opacity: 0.85; color: #fff; }
    .section { padding: 12px; border-top: 1px solid var(--border); }
    .section h2 { font-size: 13px; margin-bottom: 10px; }
    .row {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; padding: 10px; background: var(--bg-card);
      border-radius: 8px; margin-bottom: 8px;
    }
    .muted { font-size: 10px; color: var(--text-muted); }
    .balance { color: var(--success); font-weight: bold; }
    input, select {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text); font-size: 13px; margin-bottom: 8px;
    }
    .btn {
      width: 100%; padding: 11px; background: var(--accent); border: none;
      border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; margin-top: 6px;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn.secondary { background: var(--bg-elev); color: var(--text); }
    .btn.danger { background: var(--danger); }
    .theme-toggle { cursor: pointer; user-select: none; }
    .status { font-size: 11px; color: var(--text-muted); padding: 4px 12px; }
    .error { color: var(--danger); }
    .hidden { display: none; }
    .empty { padding: 12px; text-align: center; color: var(--text-muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🏦 TigerMasterWallet</h1>
    <p id="headerSub">Enterprise Wallet Management</p>
  </div>

  <!-- Auth view (shown when not logged in) -->
  <div id="authView" class="section">
    <h2 id="authTitle">Sign In</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="email" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <input id="name" type="text" placeholder="Full name (register only)" class="hidden" />
    <button class="btn" id="authBtn">Sign In</button>
    <button class="btn secondary" id="toggleAuthMode">Create account</button>
  </div>

  <!-- Wallet view (shown when logged in) -->
  <div id="walletView" class="hidden">
    <div class="status" id="status">Loadingâ¦</div>
    <div class="section">
      <h2>Master Wallets</h2>
      <div id="walletList"><div class="empty">No wallets loaded.</div></div>
    </div>
    <div class="section">
      <h2>Actions</h2>
      <button class="btn" id="refreshBtn">↻ Refresh</button>
      <button class="btn secondary" id="themeToggleBtn">Toggle theme</button>
      <button class="btn danger" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
