<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TigerMasterWallet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      text-align: center;
    }
    .header h1 { font-size: 20px; margin-bottom: 5px; }
    .header p { font-size: 12px; opacity: 0.8; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 15px;
    }
    .stat-card {
      background: #2d2d2d;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-value { font-size: 18px; font-weight: bold; }
    .stat-label { font-size: 10px; color: #888; margin-top: 5px; }
    .section { padding: 15px; border-top: 1px solid #333; }
    .section h2 { font-size: 14px; margin-bottom: 10px; }
    .wallet-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #2d2d2d;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .wallet-name { font-weight: bold; }
    .wallet-balance { color: #4caf50; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #667eea;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover { background: #5a6fd6; }
    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #2d2d2d;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .toggle {
      width: 40px;
      height: 20px;
      background: #444;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
    }
    .toggle.active { background: #667eea; }
    .toggle::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.2s;
    }
    .toggle.active::after { transform: translateX(20px); }
  </style>
</head>
<body>
  <div class="header">
    <h1>🏦 TigerMasterWallet</h1>
    <p>Enterprise Wallet Management</p>
  </div>
  
  <div class="stats">
    <div class="stat-card">
      <div class="stat-value">15</div>
      <div class="stat-label">Total Wallets</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">$12.5M</div>
      <div class="stat-label">Total Volume</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">8</div>
      <div class="stat-label">Users</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">3</div>
      <div class="stat-label">Pending Tx</div>
    </div>
  </div>
  
  <div class="section">
    <h2>Sub-Wallets</h2>
    <div class="wallet-item">
      <div>
        <div class="wallet-name">User Wallet 1</div>
        <div style="font-size: 10px; color: #888;">0x111...111</div>
      </div>
      <div class="wallet-balance">$45,000</div>
    </div>
    <div class="wallet-item">
      <div>
        <div class="wallet-name">User Wallet 2</div>
        <div style="font-size: 10px; color: #888;">0x222...222</div>
      </div>
      <div class="wallet-balance">$23,500</div>
    </div>
    <div class="wallet-item">
      <div>
        <div class="wallet-name">User Wallet 3</div>
        <div style="font-size: 10px; color: #888;">0x333...333</div>
      </div>
      <div class="wallet-balance">$12,000</div>
    </div>
    <button class="btn" id="viewAll">View All Wallets</button>
  </div>
  
  <div class="section">
    <h2>Quick Actions</h2>
    <button class="btn" style="background: #4caf50;">➕ Create Wallet</button>
    <button class="btn" style="background: #ff9800;">👤 Add User</button>
    <button class="btn" style="background: #e91e63;">🔑 Auto Sign</button>
  </div>
  
  <div class="section">
    <h2>Settings</h2>
    <div class="settings-row">
      <span>Dark Mode</span>
      <div class="toggle active" id="themeToggle"></div>
    </div>
    <div class="settings-row">
      <span>Auto-Approve</span>
      <div class="toggle" id="autoApprove"></div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
