plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tigermaster'
    compileSdk 34

    defaultConfig {
        applicationId "com.tigermaster"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }
    composeOptions {
        // Compose compiler 1.5.3 matches Kotlin 1.9.10.
        kotlinCompilerExtensionVersion '1.5.3'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // --- AndroidX core / appcompat ---
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // --- Lifecycle (ViewModel + viewModelScope + Compose interop) ---
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'

    // --- Coroutines ---
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // --- Jetpack Compose (used by MainActivity UI) ---
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.activity:activity-compose:1.8.0'

    // --- BiometricPrompt + FragmentActivity host ---
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.1'

    // --- CredentialManager (passkeys; used by PasskeyService) ---
    implementation 'androidx.credentials:credentials:1.2.0'

    // --- EncryptedSharedPreferences / MasterKey ---
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // --- OkHttp (HTTP + WebSocket; MasterWalletApiService, WebSocketService) ---
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // --- web3j (keccak256 + secp256k1 ECDSA; AccountAbstractionService, PaymasterService) ---
    implementation 'org.web3j:core:4.10.0'

    // --- javax.websocket API (declared by WebSocketService import; implemented by the
    //     container at runtime, API-only artifact keeps the import resolvable) ---
    implementation 'javax.websocket:javax.websocket-api:1.1'

    // --- Firebase Cloud Messaging (PushNotificationService extends FirebaseMessagingService) ---
    implementation 'com.google.firebase:firebase-messaging:23.4.0'
}
