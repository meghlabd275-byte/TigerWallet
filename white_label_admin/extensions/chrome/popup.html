<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg: #ffffff; --card: #f5f5f5; --text: #1a1a2e; --muted: #666; --accent: #0d6efd; --border: #e0e0e0; }
    body.dark { --bg: #0f0f17; --card: #1c1c2b; --text: #f5f5f7; --muted: #9aa0b0; --accent: #3b82f6; --border: #2a2a3a; }
    body { width: 360px; padding: 12px; font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    h1 { font-size: 15px; }
    .theme-toggle { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
    .tab { padding: 4px 8px; background: var(--card); border-radius: 6px; cursor: pointer; font-size: 11px; border: 1px solid var(--border); }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .section { display: none; }
    .section.active { display: block; }
    .card { background: var(--card); border-radius: 8px; padding: 10px; margin-bottom: 8px; border: 1px solid var(--border); }
    .card h3 { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .ep { font-family: ui-monospace, monospace; font-size: 11px; padding: 2px 0; color: var(--text); }
    .ep.gov { color: var(--accent); }
    .note { font-size: 10px; color: var(--muted); margin-top: 6px; }
    .btn { width: 100%; padding: 10px; margin-top: 8px; background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>White Label Admin</h1>
    <button class="theme-toggle" id="theme-toggle">Dark</button>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="sections"></div>
  <button class="btn" id="open-dashboard">Open Dashboard</button>
  <script src="popup.js"></script>
</body>
</html>
