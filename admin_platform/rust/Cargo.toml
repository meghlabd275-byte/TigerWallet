[package]
name = "tiger-admin-rust"
version = "1.0.0"
edition = "2021"
description = "TigerWallet High-Speed Admin Backend in Rust"
authors = ["TigerWallet Team"]
license = "MIT"

[dependencies]
# Web framework
actix-web = "4.4"
actix-rt = "2.9"
actix-cors = "0.7"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# JWT
jsonwebtoken = "9.2"
bcrypt = "0.15"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Configuration
config = "0.14"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Async utilities
futures = "0.3"
once_cell = "1.19"

# Rate limiting
governor = "0.5"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Encryption
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.21"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async trait
async-trait = "0.1"

[lib]
name = "tiger_admin_rust"
path = "src/lib.rs"

[[bin]]
name = "tiger-admin-rust"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1