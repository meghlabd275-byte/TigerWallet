user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20m;

    upstream billing_service      { server billing-service:9001; }
    upstream multi_tenancy_service { server multi-tenancy-service:9002; }
    upstream fetcher_service      { server fetcher-service:9003; }
    upstream notification_service { server notification-service:9004; }

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location /api/v1/billing/ {
            proxy_pass http://billing_service;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/tenants {
            proxy_pass http://multi_tenancy_service;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/fetchers {
            proxy_pass http://fetcher_service;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/notifications {
            proxy_pass http://notification_service;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
