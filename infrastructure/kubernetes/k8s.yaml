# TigerWallet Kubernetes Deployment Configuration
# Production-ready with auto-scaling, monitoring, and security

apiVersion: v1
kind: Namespace
metadata:
  name: tigerwallet
  labels:
    name: tigerwallet
    environment: production
---
# ConfigMap for shared configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: tigerwallet-config
  namespace: tigerwallet
data:
  DATABASE_HOST: "postgres.tigerwallet.svc.cluster.local"
  DATABASE_PORT: "5432"
  REDIS_HOST: "redis.tigerwallet.svc.cluster.local"
  REDIS_PORT: "6379"
  LOG_LEVEL: "info"
  ENVIRONMENT: "production"
---
# Secrets
apiVersion: v1
kind: Secret
metadata:
  name: tigerwallet-secrets
  namespace: tigerwallet
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  SMTP_PASSWORD: ""
  TWILIO_AUTH_TOKEN: ""
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tigerwallet
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
# PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tigerwallet
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: tigerwallet
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tigerwallet-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: tigerwallet
            - name: POSTGRES_MAX_CONNECTIONS
              value: "200"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "tigerwallet"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tigerwallet"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
        storageClassName: fast-ssd
---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tigerwallet
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tigerwallet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - "--appendonly"
            - "yes"
            - "--maxmemory"
            - "512mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--cluster-enabled"
            - "yes"
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: redis-storage
          emptyDir: {}
---
# Billing Service
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: tigerwallet
spec:
  type: ClusterIP
  ports:
    - port: 9001
      targetPort: 9001
  selector:
    app: billing-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: tigerwallet
spec:
  replicas: 5
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: billing-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: billing
          image: tigerwallet/billing-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9001
          env:
            - name: BILLING_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: tigerwallet-config
                  key: DATABASE_HOST
            - name: BILLING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tigerwallet-secrets
                  key: DB_PASSWORD
            - name: BILLING_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tigerwallet-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 5
            periodSeconds: 10
      serviceAccountName: tigerwallet
---
# HPA for Billing Service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: billing-service-hpa
  namespace: tigerwallet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: billing-service
  minReplicas: 5
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
---
# Multi-Tenancy Service
apiVersion: v1
kind: Service
metadata:
  name: multi-tenancy-service
  namespace: tigerwallet
spec:
  type: ClusterIP
  ports:
    - port: 9002
      targetPort: 9002
  selector:
    app: multi-tenancy-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-tenancy-service
  namespace: tigerwallet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: multi-tenancy-service
  template:
    metadata:
      labels:
        app: multi-tenancy-service
    spec:
      containers:
        - name: multi-tenancy
          image: tigerwallet/multi-tenancy-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9002
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
---
# Fetcher Service (Rust)
apiVersion: v1
kind: Service
metadata:
  name: fetcher-service
  namespace: tigerwallet
spec:
  type: ClusterIP
  ports:
    - port: 9003
      targetPort: 9003
  selector:
    app: fetcher-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetcher-service
  namespace: tigerwallet
spec:
  replicas: 10
  selector:
    matchLabels:
      app: fetcher-service
  template:
    metadata:
      labels:
        app: fetcher-service
    spec:
      containers:
        - name: fetcher
          image: tigerwallet/fetcher-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9003
          resources:
            requests:
              memory: "512Mi"
              cpu: "1000m"
            limits:
              memory: "2Gi"
              cpu: "4"
---
# Notification Service
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: tigerwallet
spec:
  type: ClusterIP
  ports:
    - port: 9004
      targetPort: 9004
  selector:
    app: notification-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: tigerwallet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification
          image: tigerwallet/notification-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9004
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
---
# KYC Service
apiVersion: v1
kind: Service
metadata:
  name: kyc-service
  namespace: tigerwallet
spec:
  type: ClusterIP
  ports:
    - port: 9005
      targetPort: 9005
  selector:
    app: kyc-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-service
  namespace: tigerwallet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kyc-service
  template:
    metadata:
      labels:
        app: kyc-service
    spec:
      containers:
        - name: kyc
          image: tigerwallet/kyc-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9005
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tigerwallet-ingress
  namespace: tigerwallet
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.tigerwallet.com
        - admin.tigerwallet.com
        - portal.tigerwallet.com
      secretName: tigerwallet-tls
  rules:
    - host: api.tigerwallet.com
      http:
        paths:
          - path: /api/v1/billing
            pathType: Prefix
            backend:
              service:
                name: billing-service
                port:
                  number: 9001
          - path: /api/v1/tenants
            pathType: Prefix
            backend:
              service:
                name: multi-tenancy-service
                port:
                  number: 9002
          - path: /api/v1/fetcher
            pathType: Prefix
            backend:
              service:
                name: fetcher-service
                port:
                  number: 9003
          - path: /api/v1/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 9004
          - path: /api/v1/kyc
            pathType: Prefix
            backend:
              service:
                name: kyc-service
                port:
                  number: 9005
---
# NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tigerwallet-network-policy
  namespace: tigerwallet
spec:
  podSelector:
    matchLabels:
      app: tigerwallet
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx-ingress
      ports:
        - protocol: TCP
          port: 9000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: tigerwallet
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: billing-service-pdb
  namespace: tigerwallet
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: billing-service
