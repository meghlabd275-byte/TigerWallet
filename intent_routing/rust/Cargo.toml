[package]
name = "intent_routing"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha3 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
