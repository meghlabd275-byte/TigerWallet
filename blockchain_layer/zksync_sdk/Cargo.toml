[package]
name = "tiger_zksync"
version = "0.1.0"
edition = "2021"
description = "TigerWallet zkSync Era SDK - zkEVM L2 Blockchain Support"

[dependencies]
# Cryptography
sha3 = "0.10"
keccak-hash = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
ecdsa = "0.14"
elliptic-curve = "0.12"
rand = "0.8"

[lib]
name = "tiger_zksync"
path = "src/lib.rs"
