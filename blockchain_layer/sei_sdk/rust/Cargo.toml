[package]
name = "tiger-sei"
version = "0.1.0"
edition = "2021"
description = "TigerWallet Sei Blockchain SDK - Production Ready"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.0", features = ["full"] }
sha2 = "0.10"
sha3 = "0.10"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
hex = "0.4"
base64 = "0.21"
rand = "0.8"
async-trait = "0.1"
log = "0.4"

[lib]
name = "tiger_sei"
path = "src/lib.rs"
