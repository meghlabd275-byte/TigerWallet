[package]
name = "tiger_starknet"
version = "0.1.0"
edition = "2021"
description = "TigerWallet Starknet SDK - Cairo L2 Blockchain Support"

[dependencies]
# Cryptography
sha3 = "0.10"
keccak-hash = "0.10"
ecdsa = "0.14"
elliptic-curve = "0.12"
hex = "0.4"
base64 = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
rusqlite = { version = "0.30", features = ["bundled"] }
blake2 = "0.10"
rand = "0.8"
zeroize = "1.7"

[dependencies.starknet-crypto]
version = "0.2"
optional = true

[features]
default = ["starknet-crypto"]
starknet-crypto = ["dep:starknet-crypto"]

[lib]
name = "tiger_starknet"
path = "src/lib.rs"
