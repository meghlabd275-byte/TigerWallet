[package]
name = "tiger_starknet"
version = "0.1.0"
edition = "2021"
description = "TigerWallet Starknet SDK - Cairo L2 Blockchain Support"

[dependencies]
# Stark-curve ECDSA and Pedersen hashing. Everything cryptographic in this
# crate routes through it, so there is one audited implementation.
starknet-crypto = "0.2"
# Function selectors are Keccak-256 of the entry point name, masked to 250 bits.
sha3 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
rand = "0.8"

[lib]
name = "tiger_starknet"
path = "src/lib.rs"
