[package]
name = "tiger-cardano"
version = "0.1.0"
edition = "2021"
description = "TigerWallet Cardano Blockchain SDK - Production Ready"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.0", features = ["full"] }
sha2 = "0.10"
sha3 = "0.10"
ed25519-bip32 = "0.2"
cryptography = { package = "cardano-crypto", version = "2.0" }
base58 = "0.2"
bech32 = "0.8"
hex = "0.4"
rand = "0.8"
async-trait = "0.1"
log = "0.4"
cbor = "0.5"
ed25519-zebra = "3.0"

[lib]
name = "tiger_cardano"
path = "src/lib.rs"
