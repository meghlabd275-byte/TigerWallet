[package]
name = "tiger-substrate"
version = "0.1.0"
edition = "2021"
description = "TigerWallet Substrate/Polkadot SDK - Full blockchain integration"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
hex = "0.4"
sha2 = "0.10"
blake2 = "0.10"

[lib]
name = "tiger_substrate"
path = "src/lib.rs"
