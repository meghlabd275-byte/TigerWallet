[package]
name = "tiger_perpetuals"
version = "1.0.0"
edition = "2021"

[dependencies]
rust_decimal = "1.37"
rust_decimal_macros = "1.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "2.0"
parking_lot = "0.12"
dashmap = "6.0"
rayon = "1.10"
bitvec = "1.0"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
tokio = { version = "1.42", features = ["full"] }
log = "0.4"
env_logger = "0.11"
csv = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1