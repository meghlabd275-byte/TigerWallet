[package]
name = "tigerwallet-rbac-admin"
version = "1.0.0"
edition = "2021"
description = "TigerWallet RBAC Admin Backend - High-speed Rust implementation"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "add_authority"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }

# Authentication
jsonwebtoken = "9"
bcrypt = "0.15"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client for external services
reqwest = { version = "0.12", features = ["json"] }

# Async runtime
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "rbac_admin"
path = "src/lib.rs"

[[bin]]
name = "rbac-admin-server"
path = "src/main.rs"
