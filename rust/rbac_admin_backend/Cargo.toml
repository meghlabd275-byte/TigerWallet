[package]
name = "tigerwallet-rbac-admin"
version = "1.0.0"
edition = "2021"
description = "TigerWallet RBAC Admin Backend - High-speed Rust implementation"

[dependencies]
# Web framework
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database — tokio-postgres (runtime, no compile-time DATABASE_URL needed) +
# deadpool-postgres for connection pooling. Pool owns its own tokio Runtime and
# exposes SYNCHRONOUS wrappers so the existing async API call sites keep working.
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
deadpool-postgres = "0.14"
deadpool = "0.12"

# Authentication
jsonwebtoken = "9"
bcrypt = "0.15"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client for external services
reqwest = { version = "0.12", features = ["json"] }

# Async runtime
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "rbac_admin"
path = "src/lib.rs"

