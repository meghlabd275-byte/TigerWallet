[package]
name = "trading_bots"
version = "1.0.0"
edition = "2021"
description = "TigerWallet High-Performance Trading Bots"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
async-trait = "0.1"
parking_lot = "0.12"
once_cell = "1.19"
directories = "5.0"
rust_decimal = { version = "1.33", features = ["serde", "serde-with-str"] }
rand = "0.8"

[features]
default = ["runtime-tokio"]
runtime-tokio = ["tokio/rt-multi-thread", "tokio/macros"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
