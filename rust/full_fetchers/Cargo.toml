[package]
name = "tigerwallet-full-fetchers"
version = "1.0.0"
edition = "2021"
description = "TigerWallet Full Fetchers - High Speed Rust Implementation with Real Blockchain APIs"
authors = ["TigerWallet Team"]
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
secp256k1 = { version = "0.28", features = ["global-context", "rand"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
once_cell = "1.19"
parking_lot = "0.12"
async-trait = "0.1"

# URL parsing
url = "2.5"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"

[features]
default = ["full"]
full = ["runtime"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
