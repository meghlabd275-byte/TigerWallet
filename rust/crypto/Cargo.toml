[package]
name = "tigerwallet-crypto"
version = "0.1.0"
edition = "2021"
description = "TigerWallet Crypto Library - High-speed cryptographic operations"

[dependencies]
# Basic hashing
sha2 = "0.10"
sha3 = "0.10"
keccak = "0.1"
ripemd = "0.1"
blake2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"

# Elliptic curve cryptography
secp256k1 = { version = "0.27", features = ["recovery", "global-context", "rand-std"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }

# BIP-39 mnemonic (real, standards-compliant)
bip39 = "2"

# Encoding
hex = "0.4"
base58 = "0.2"
base64 = "0.21"
bs58 = "0.5"

# HTTP client
reqwest = { version = "0.11", features = ["json", "blocking"] }

# Symmetric encryption (AES)
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
aead = "0.5"

# Password hashing (Argon2)
argon2 = "0.5"

# Utilities
rand = "0.8"
zeroize = "1"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[lib]
name = "tigerwallet_crypto"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
