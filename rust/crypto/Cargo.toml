[package]
name = "tigerwallet-crypto"
version = "0.1.0"
edition = "2021"
description = "TigerWallet Crypto Library - High-speed cryptographic operations"

[dependencies]
sha2 = "0.10"
sha3 = "0.10"
keccak = "0.1"
ripemd160 = "0.10"
secp256k1 = { version = "0.24", features = ["recovery", "global-context"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
blake2 = "0.10"
hex = "0.4"
base58 = "0.2"
base64 = "0.21"
twofish = "0.7"
aes = "0.8"
cbc = "0.1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[lib]
name = "tigerwallet_crypto"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
