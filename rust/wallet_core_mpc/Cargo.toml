[package]
name = "tigerwallet-mpc"
version = "1.0.0"
edition = "2021"
description = "TigerWallet MPC Wallet Core - High-performance multi-party computation wallet"

[dependencies]
# Cryptography
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "digest"] }
secp256k1 = { version = "0.28", features = ["recovery", "global-context"] }
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
bitcoin = { version = "0.31", features = ["secp256k1", "serde"] }
bs58 = "0.5"
thiserror = "1.0"

# Async
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Cache
lru = "0.12"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
