[package]
name = "userwallet_fetchers"
version = "1.0.0"
edition = "2021"
description = "TigerWallet UserWallet fetchers — typed async client delegating to the canonical go/wallet_api backend"

[lib]
name = "userwallet_fetchers"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
