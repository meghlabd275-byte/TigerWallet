[package]
name = "masterwallet_fetchers"
version = "1.0.0"
edition = "2021"
description = "High-performance MasterWallet fetchers with PostgreSQL and Redis"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# PostgreSQL — with-serde_json-1 enables FromSql/ToSql for serde_json::Value (JSONB columns)
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
postgis = "0.9"
bb8 = "0.8"

# Redis — script feature enables redis::Script for atomic Lua lock release
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "script"] }

# HTTP client — blocking feature for synchronous blockchain RPC calls
reqwest = { version = "0.11", features = ["json", "rustls-tls", "blocking"], default-features = false }

# Real secp256k1 ECDSA for EVM transaction/message signing (no fake crypto).
# The `recovery` feature exposes sign_ecdsa_recoverable / recover_ecdsa / RecoveryId.
secp256k1 = { version = "0.28", features = ["rand", "global-context", "recovery"] }
sha3 = "0.10"
hex = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
parking_lot = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

# Metrics
metrics = "0.21"
prometheus = "0.13"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[lib]
name = "masterwallet_fetchers"
path = "src/lib.rs"
