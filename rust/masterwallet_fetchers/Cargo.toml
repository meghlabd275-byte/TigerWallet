[package]
name = "masterwallet_fetchers"
version = "1.0.0"
edition = "2021"
description = "High-performance MasterWallet fetchers with PostgreSQL and Redis"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# PostgreSQL
tokio-postgres = "0.7"
postgis = "0.9"
bb8 = "0.8"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
parking_lot = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

# Metrics
metrics = "0.21"
prometheus = "0.13"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[lib]
name = "masterwallet_fetchers"
path = "src/lib.rs"
