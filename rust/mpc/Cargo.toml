[package]
name = "tiger-mpc-wallet"
version = "1.0.0"
edition = "2021"
description = "TigerWallet MPC (Multi-Party Computation) Wallet - Production Ready"
authors = ["TigerWallet Team"]
license = "MIT"

[dependencies]
# Cryptography
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
crypto-bigint = "0.5"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.21"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
zeroize = { version = "1.7", features = ["derive"] }

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
