[package]
name = "tiger-key-management"
version = "1.0.0"
edition = "2021"
description = "TigerWallet Secure Key Management - Real cryptographic implementation"

[dependencies]
# Cryptographic libraries
k256 = { version = "0.13", features = ["ecdsa", "sha2", "arithmetic"] }
sha2 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
hex = "0.4"
rand = "0.8"
uuid = { version = "1.6", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
base64 = "0.21"

[features]
default = ["std"]
std = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
