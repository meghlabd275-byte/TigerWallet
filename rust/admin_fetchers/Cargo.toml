[package]
name = "admin_fetchers"
version = "0.1.0"
edition = "2021"
description = "TigerWallet Admin Fetchers — high-speed admin/analytics fetchers (PostgreSQL + Redis). No fake crypto."
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
redis = { version = "0.23", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
