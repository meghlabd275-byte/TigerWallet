[package]
name = "tiger-kyc-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "TigerWallet in-house KYC service: HTTP API and PostgreSQL persistence over the tiger-kyc-engine verification engine."
license = "Proprietary"

[[bin]]
name = "tiger-kyc-service"
path = "src/main.rs"

[dependencies]
# The verification engine is dependency-free; all HTTP and database
# dependencies live here so the auditable decision logic stays isolated.
tiger-kyc-engine = { path = "../kyc_engine" }

axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.5", features = ["trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.8 is required: 0.7 fails to compile on current Rust releases (the
# sqlx-postgres 0.7 copy path trips newer type-inference rules).
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
