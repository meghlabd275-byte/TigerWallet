[package]
name = "tigerswap-mev-protection"
version = "1.0.0"
edition = "2021"
authors = ["TigerSwap Team"]
description = "MEV protection service for TigerSwap"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
# rustls avoids a system OpenSSL dependency and keeps TLS in-process.
reqwest = { version = "0.11", default-features = false, features = [
    "json",
    "rustls-tls",
] }
tracing = "0.1"
thiserror = "1.0"
hex = "0.4"
sha3 = "0.10"
tiny-keccak = { version = "2", features = ["keccak"] }
rand = "0.8"

[dev-dependencies]

[lib]
name = "tigerswap_mev_protection"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
