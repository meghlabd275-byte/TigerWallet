<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-card: #f5f5f5;
      --text: #1f2937;
      --text-secondary: #6b7280;
      --accent: #F97316;
      --accent-hover: #EA580C;
      --border: #e5e7eb;
      --error: #dc2626;
      --success: #16a34a;
    }
    [data-theme="dark"] {
      --bg: #111827;
      --bg-card: #1f2937;
      --text: #f9fafb;
      --text-secondary: #9ca3af;
      --border: #374151;
      --accent: #F97316;
      --accent-hover: #FB923C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    h1 { font-size: 18px; color: var(--accent); }
    .theme-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: var(--accent);
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    button:hover { background-color: var(--accent-hover); }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .toggle-auth { background: transparent !important; color: var(--text-secondary) !important; border: none; font-size: 12px; }
    .error { color: var(--error); font-size: 12px; margin-bottom: 8px; }
    .total { font-size: 22px; font-weight: 700; }
    .total-usd { font-size: 13px; color: var(--text-secondary); }
    .wallet-item { padding: 8px 0; border-bottom: 1px solid var(--border); }
    .wallet-item:last-child { border-bottom: none; }
    .wallet-label { font-weight: 600; font-size: 14px; }
    .wallet-addr { font-size: 11px; color: var(--text-secondary); font-family: monospace; }
    .wallet-balance { font-size: 13px; margin-top: 2px; }
    .hidden { display: none; }
    .spinner { text-align: center; color: var(--text-secondary); padding: 16px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
    .tab-btn {
      flex: 1 1 auto; min-width: 70px; padding: 6px 4px; font-size: 11px;
      font-weight: 600; background: var(--bg-card); color: var(--text-secondary);
      border: 1px solid var(--border); border-radius: 8px; cursor: pointer; margin: 0;
    }
    .tab-btn:hover { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>TigerWallet</h1>
    <button class="theme-btn" id="toggleTheme">🌙</button>
  </header>

  <!-- Auth section -->
  <div id="authSection">
    <div class="card">
      <div id="loginForm">
        <h2 style="font-size:15px;margin-bottom:6px;">TigerWallet</h2>
        <p style="font-size:11px;color:var(--text-secondary);margin-bottom:12px;">No registration required. Create or import a wallet to get started.</p>
        <div class="error hidden" id="authError"></div>
        <button id="guestStart" style="margin-bottom:8px;">➕ Create / Import Wallet</button>
        <div style="text-align:center;font-size:11px;color:var(--text-secondary);margin:8px 0;">— or sign in with email —</div>
        <h2 style="font-size:15px;margin-bottom:10px;" id="authTitle">Login</h2>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
        <div id="usernameField" class="hidden">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="username" />
        </div>
        <label for="password">Password (min 8 chars)</label>
        <input type="password" id="password" placeholder="••••••••" />
        <button id="authSubmit">Login</button>
        <button class="toggle-auth" id="authToggle">Don't have an account? Register</button>
      </div>
    </div>
  </div>

  <!-- Wallet section -->
  <div id="walletSection" class="hidden">
    <div class="card">
      <div class="total-usd">Total Balance</div>
      <div class="total" id="totalUsd">$0.00</div>
      <button class="secondary" id="refreshBtn">Refresh</button>
    </div>

    <!-- Navigation tabs -->
    <div class="tabs">
      <button class="tab-btn" data-tab="walletTab">Wallets</button>
      <button class="tab-btn" data-tab="sendTab">Send</button>
      <button class="tab-btn" data-tab="convertTab">Convert</button>
      <button class="tab-btn" data-tab="stakingTab">Staking</button>
      <button class="tab-btn" data-tab="fiatTab">Fiat Ramp</button>
      <button class="tab-btn" data-tab="qrTab">QR Scan</button>
      <button class="tab-btn" data-tab="kycTab">KYC</button>
    </div>

    <!-- Wallets tab -->
    <div id="walletTab" class="card">
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">My Wallets</div>
      <button class="secondary" id="createPasskeyBtn" style="margin-bottom:8px;">🔐 Create with Passkey</button>
      <div id="passkeyResult" class="wallet-balance"></div>
      <div id="walletList"><div class="spinner">Loading...</div></div>
    </div>

    <!-- Send tab -->
    <div id="sendTab" class="card hidden">
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">Send</div>
      <label for="sendTo">Recipient address</label>
      <input type="text" id="sendTo" placeholder="0x..." />
      <label for="sendAmount">Amount</label>
      <input type="text" id="sendAmount" placeholder="0.0" />
      <label for="sendPassword">Wallet password</label>
      <input type="password" id="sendPassword" placeholder="••••••••" />
      <label for="unlockPasscode">Passcode (passwordless unlock)</label>
      <input type="password" id="unlockPasscode" placeholder="app-lock passcode" />
      <button class="secondary" id="unlockBtn" style="margin-bottom:8px;">🔓 Unlock (passwordless)</button>
      <div id="unlockStatus" class="wallet-balance"></div>
      <button id="sendBtn">Send</button>
      <div id="sendStatus" class="wallet-balance"></div>
    </div>

    <!-- Convert tab -->
    <div id="convertTab" class="card hidden">
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">Convert</div>
      <label for="convertFrom">From token</label>
      <input type="text" id="convertFrom" placeholder="ETH" />
      <label for="convertTo">To token</label>
      <input type="text" id="convertTo" placeholder="USDC" />
      <label for="convertAmount">Amount</label>
      <input type="text" id="convertAmount" placeholder="0.0" />
      <label for="convertChain">Chain</label>
      <select id="convertChain"></select>
      <button id="convertBtn">Get Quote</button>
      <div id="convertResult" class="wallet-balance"></div>
    </div>

    <!-- Staking tab -->
    <div id="stakingTab" class="card hidden">
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">Staking</div>
      <div id="stakingList"><div class="spinner">Loading...</div></div>
      <label for="stakeToken">Token</label>
      <input type="text" id="stakeToken" placeholder="ETH" />
      <label for="stakeAmount">Amount</label>
      <input type="text" id="stakeAmount" placeholder="0.0" />
      <label for="stakePassword">Wallet password</label>
      <input type="password" id="stakePassword" placeholder="••••••••" />
      <button id="stakeBtn">Stake</button>
    </div>

    <!-- Fiat ramp tab -->
    <div id="fiatTab" class="card hidden">
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">Fiat On/Off-Ramp</div>
      <label for="fiatProvider">Provider</label>
      <select id="fiatProvider"></select>
      <label for="fiatAmount">Amount</label>
      <input type="text" id="fiatAmount" placeholder="100" />
      <label for="fiatCurrency">Fiat currency</label>
      <input type="text" id="fiatCurrency" placeholder="USD" />
      <label for="fiatCrypto">Crypto</label>
      <input type="text" id="fiatCrypto" placeholder="ETH" />
      <label for="fiatMethod">Payment method</label>
      <input type="text" id="fiatMethod" placeholder="card" />
      <button id="fiatBuyBtn">Buy (On-Ramp)</button>
      <button id="fiatSellBtn">Sell (Off-Ramp)</button>
      <div id="fiatResult" class="wallet-balance"></div>
      <a id="fiatOpenUrl" class="hidden" href="#" target="_blank" rel="noopener noreferrer" style="display:block;margin-top:8px;color:var(--accent);font-size:13px;">Open provider checkout</a>
    </div>

    <!-- QR scan tab -->
    <div id="qrTab" class="card hidden">
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">Scan / Paste Payment URI</div>
      <label for="qrInput">Paste address or EIP-681 URI</label>
      <input type="text" id="qrInput" placeholder="0x... or ethereum:0x...?value=1" />
      <button id="qrParseBtn">Parse</button>
      <div id="qrResult" class="wallet-balance"></div>
      <label for="qrToAddress">Recipient (parsed)</label>
      <input type="text" id="qrToAddress" placeholder="0x..." />
      <label for="qrAmount">Amount (parsed)</label>
      <input type="text" id="qrAmount" placeholder="0.0" />
      <button id="qrSendBtn">Send Parsed</button>
    </div>

    <!-- KYC tab -->
    <div id="kycTab" class="card hidden">
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">KYC Verification</div>
      <div id="kycStatus" class="wallet-balance"></div>
      <div id="kycForm" class="hidden">
        <label for="kycFullName">Full name</label>
        <input type="text" id="kycFullName" placeholder="Jane Doe" />
        <label for="kycDocType">Document type</label>
        <input type="text" id="kycDocType" placeholder="passport / id_card / driver_license" />
        <label for="kycDocNumber">Document number</label>
        <input type="text" id="kycDocNumber" placeholder="AB1234567" />
        <button id="kycSubmitBtn">Start KYC</button>
      </div>
      <div id="kycError" class="error hidden"></div>
    </div>

    <button id="logoutBtn" class="toggle-auth">Logout</button>
  </div>

  <script src="src/popup.js"></script>
</body>
</html>
