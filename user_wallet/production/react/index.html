    <!-- Google Identity Services (GIS) + gapi client for encrypted mnemonic
         backup to Google Drive (BackupMnemonic). Both scripts are loaded
         synchronously at head so window.google / window.gapi are available
         before the user reaches the backup step. If VITE_GOOGLE_CLIENT_ID is
         unset, the Drive button is disabled honestly (no fake success). -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
