[package]
name = "tigerwallet_user_wallet"
version = "1.0.0"
edition = "2021"
description = "TigerWallet UserWallet Rust client — typed async HTTP client delegating to the canonical go/wallet_api backend"

[lib]
name = "tigerwallet_user_wallet"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
