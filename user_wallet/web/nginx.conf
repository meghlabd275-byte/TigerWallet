server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to the canonical wallet_api backend (go/wallet_api :8443).
    # The service name is overridable per deployment via the compose network.
    location /api/ {
        proxy_pass http://user-wallet-backend:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health probe (the client derives this from the API base).
    location /health {
        proxy_pass http://user-wallet-backend:8443;
        proxy_set_header Host $host;
    }

    # Live feed WebSocket.
    location /ws {
        proxy_pass http://user-wallet-backend:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
