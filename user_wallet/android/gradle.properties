# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run Gradle in parallel + configure on demand for faster builds.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX (required by Compose, security-crypto, lifecycle, etc.).
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Non-transitive R classes for smaller, faster resource resolution.
android.nonTransitiveRClass=true
