plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.tigeruserwallet"
    compileSdk 34

    defaultConfig {
        applicationId "com.tigeruserwallet"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // CredentialManager — real passkey/biometric unlock (androidx.credentials)
    implementation "androidx.credentials:credentials:1.2.2"
    implementation "androidx.credentials:credentials-play-services-auth:1.2.2"
    // Google Drive encrypted-seed backup (Google Identity + Drive REST)
    implementation "com.google.android.gms:play-services-auth:21.2.0"
    implementation "com.google.api-client:google-api-client-android:2.4.1"
    implementation "com.google.apis:google-api-services-drive:v3-rev20240514-2.0.0"
}
