<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TigerWallet Admin</title>
    <style>
        :root {
            --bg-primary: #F8F9FA;
            --bg-secondary: #FFFFFF;
            --text-primary: #1A1A2E;
            --text-secondary: #6B7280;
            --primary-color: #FF6B35;
            --border-color: #E5E7EB;
        }

        [data-theme="dark"] {
            --bg-primary: #0A0A0F;
            --bg-secondary: #141419;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0A0;
            --border-color: #2A2A35;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            min-height: 400px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .header {
            background: linear-gradient(135deg, #FF6B35, #6C5CE7);
            padding: 16px;
            color: white;
        }

        .header h1 {
            font-size: 18px;
            font-weight: bold;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .nav {
            padding: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--primary-color);
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 12px;
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .footer {
            padding: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border-color);
            transition: 0.3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🅰️ TigerAdmin</h1>
        <p>Admin Dashboard</p>
    </div>

    <div class="nav" id="nav">
        <div class="nav-item active" data-screen="dashboard">📊 Dashboard</div>
        <div class="nav-item" data-screen="users">👥 Users</div>
        <div class="nav-item" data-screen="kyc">✓ KYC</div>
        <div class="nav-item" data-screen="transactions">↔️ Transactions</div>
        <div class="nav-item" data-screen="analytics">📈 Analytics</div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-value">12,543</div>
            <div class="stat-label">Users</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">456K</div>
            <div class="stat-label">Transactions</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">145</div>
            <div class="stat-label">Pending KYC</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">$12.5M</div>
            <div class="stat-label">Volume</div>
        </div>
    </div>

    <div class="footer">
        <div class="theme-toggle">
            <label class="switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider"></span>
            </label>
            <span>Dark Mode</span>
        </div>
        <button class="btn btn-primary" id="open-dashboard">Open Dashboard</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
