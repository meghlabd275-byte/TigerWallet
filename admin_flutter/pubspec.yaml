name: tiger_admin
description: TigerWallet Admin - Complete Admin Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # HTTP & API
  dio: ^5.3.3
  retrofit: ^4.0.1
  http: ^1.1.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  
  # Theme
  flutter_theme_manager: ^1.0.3
  
  # Navigation
  go_router: ^13.0.1
  
  # Forms & Validation
  reactive_forms: ^16.1.1
  flutter_form_builder: ^9.1.1
  form_builder_validators: ^9.1.0
  
  # Tables & Data
  data_table_2: ^2.5.10
  syncfusion_flutter_datagrid: ^23.2.50
  syncfusion_flutter_charts: ^23.2.50
  
  # Charts
  fl_chart: ^0.66.0
  charts_flutter: ^0.12.0
  
  # Date/Time
  intl: ^0.18.1
  table_calendar: ^3.0.9
  
  # Utils
  uuid: ^4.2.2
  collection: ^1.18.0
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  onesignal_flutter: ^3.5.0
  
  # Biometrics
  local_auth: ^2.1.8
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^4.0.1
  
  # File Handling
  path_provider: ^2.1.2
  file_picker: ^6.1.1
  open_file: ^3.3.2
  
  # Image Handling
  image_picker: ^1.0.7
  image_cropper: ^5.0.1
  photo_view: ^0.14.0
  
  # WebView
  webview_flutter: ^4.4.1
  
  # Connectivity
  connectivity_plus: ^5.0.2
  
  # Animations
  flutter_animate: ^4.3.0
  lottie: ^3.0.0
  
  # PDF
  pdf: ^3.10.7
  printing: ^5.12.0
  
  # Excel
  excel: ^4.0.2
  
  # QR
  qr_code: ^2.0.0
  
  # Clipboard
  super_clipboard: ^0.8.2
  
  # Permissions
  permission_handler: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
